<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03130e">
  <title>Advanced Learner Library</title>
  <script>
    if (sessionStorage.getItem("hanafi-advanced-library-unlocked") !== "1") {
      window.location.replace("../");
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    html { background: #03130e; }
    body {
      margin: 0;
      min-height: 100dvh;
      background-color: #03130e;
      background-image: url("../assets/hanafi-advanced-library-background-approved.png?rev=20260924a");
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
    }
    main { min-height: 100dvh; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (hover: none) and (pointer: coarse) {
      body { background-attachment: scroll; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="libraryTitle">
    <h1 id="libraryTitle" class="visually-hidden">Advanced Learner Library</h1>
  </main>
</body>
</html>
