<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3d2e"><title>Media · Hanafi Learning Deck</title><link rel="stylesheet" href="../styles.css?release=v2.1&rev=20260924media">
<style>
.media-main{width:min(1120px,calc(100% - 2rem));margin:0 auto 3rem}.library-head{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;margin:1rem 0}.view-toggle{display:flex;gap:.4rem}.view-toggle button{border:1px solid rgba(216,181,96,.35);background:#111;color:#eee;border-radius:9px;padding:.6rem .85rem;cursor:pointer}.view-toggle button[aria-pressed="true"]{background:#d8b560;color:#111}.movie-library{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem}.movie-card{display:block;text-decoration:none;color:inherit;border:1px solid rgba(216,181,96,.28);border-radius:16px;overflow:hidden;background:#101412;transition:transform .15s,border-color .15s}.movie-card:hover{transform:translateY(-2px);border-color:#d8b560}.poster{aspect-ratio:2/3;position:relative;background:linear-gradient(160deg,#17271f,#050706 70%);overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(var(--art-scale,1));transform-origin:center var(--art-y,50%);object-position:center var(--art-y,50%)}.poster-fallback{position:absolute;inset:0;display:grid;place-items:end start;padding:1rem;font-size:1.2rem;font-weight:800;color:#f4f1e8}.card-info{padding:.7rem .8rem}.card-info h2{font-size:1rem;margin:0}.meta,.rt{display:none}.movie-library.list{display:flex;flex-direction:column;gap:.55rem}.movie-library.list .movie-card{display:grid;grid-template-columns:72px 1fr;align-items:center}.movie-library.list .poster{aspect-ratio:2/3;width:54px;height:80px;min-height:0;padding:0}.movie-library.list .card-info{display:block}.movie-library.list .meta,.movie-library.list .rt{display:none}.tech-credit{text-align:center;color:#8f938d;font-size:.72rem;margin-top:2rem}@media(max-width:520px){.movie-library{grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem}.poster{font-size:1rem;padding:.7rem}.movie-library.list .card-info{grid-template-columns:1fr}.movie-library.list .rt{grid-column:1;grid-row:auto}}
</style></head><body><header class="app-header"><a class="secondary action-link" href="../">← Home</a><p class="eyebrow">Hanafi Learning Deck</p><h1>Media</h1></header>
<main class="media-main"><div class="library-head"><div><h2>Films</h2><p>Choose a film to view editions, subtitles, details and sources.</p></div><div class="view-toggle" aria-label="Library view"><button id="cards" type="button" aria-pressed="true">Cards</button><button id="list" type="button" aria-pressed="false">List</button></div></div>
<section id="library" class="movie-library"></section><p class="tech-credit">DK Media · Nougat Media Core</p></main>
<footer><p><strong>No advertising. Islam is not for sale.</strong> No account, no paywall, and no behavioral tracking by the Hanafi Learning Deck.</p></footer>
<script>
const movies=[
{id:"al-risalah",title:"Al-Risalah",year:1976,artwork:{url:"https://upload.wikimedia.org/wikipedia/ar/thumb/0/06/The_Message_Film_Poster.jpg/450px-The_Message_Film_Poster.jpg",cacheKey:"al-risalah-1976-arabic-v2"}},
{id:"lion-of-the-desert",title:"Lion of the Desert",year:1981,artwork:{provider:"wikipedia",page:"Lion_of_the_Desert",cacheKey:"lion-of-the-desert-1981-v2",scale:1.04,y:"52%"}},
{id:"the-message",title:"The Message",year:1976,artwork:{provider:"wikipedia",page:"The_Message_(1976_film)",cacheKey:"the-message-1976-v1"}},
{id:"ten-commandments",title:"The Ten Commandments",year:1923,artwork:{provider:"commons",file:"TenCommandments-bigposter-1923.jpg",cacheKey:"ten-commandments-1923-v2"}}
];
const DB="hanafi-media-artwork",STORE="posters";function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function dbGet(k){const d=await openDB();return new Promise(ok=>{const r=d.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)})}async function dbPut(k,b){const d=await openDB();return new Promise(ok=>{const r=d.transaction(STORE,"readwrite").objectStore(STORE).put(b,k);r.onsuccess=()=>ok();r.onerror=()=>ok()})}
async function artworkURL(a){let cached=await dbGet(a.cacheKey);if(cached)return URL.createObjectURL(cached);let u=a.url;if(!u&&a.provider==="commons"){const r=await fetch("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url&iiurlwidth=500&titles=File:"+encodeURIComponent(a.file));if(r.ok){const j=await r.json(),page=Object.values(j.query?.pages||{})[0],info=page?.imageinfo?.[0];u=info?.thumburl||info?.url}}if(!u&&a.provider==="wikipedia"){const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(a.page));if(r.ok){const j=await r.json();u=(j.thumbnail&&j.thumbnail.source)||(j.originalimage&&j.originalimage.source)}}if(!u)return null;try{const r=await fetch(u);if(!r.ok)throw 0;const b=await r.blob();await dbPut(a.cacheKey,b);return URL.createObjectURL(b)}catch{return u}}
const lib=document.getElementById("library");movies.forEach(async m=>{const a=document.createElement("a");a.className="movie-card";a.href="movie.html?film="+m.id;a.innerHTML='<div class="poster"><span class="poster-fallback">'+m.title+'</span></div><div class="card-info"><h2>'+m.title+' ('+m.year+')</h2></div>';lib.appendChild(a);const u=await artworkURL(m.artwork);if(u){const img=new Image();img.alt=m.title+" poster";if(m.artwork.scale)img.style.setProperty("--art-scale",m.artwork.scale);if(m.artwork.y)img.style.setProperty("--art-y",m.artwork.y);img.onload=()=>{a.querySelector(".poster").appendChild(img);a.querySelector(".poster-fallback").hidden=true};img.src=u}});
const cards=document.getElementById("cards"),list=document.getElementById("list");function set(v){lib.classList.toggle("list",v==="list");cards.setAttribute("aria-pressed",v==="cards");list.setAttribute("aria-pressed",v==="list")}cards.addEventListener("click",()=>set("cards"));list.addEventListener("click",()=>set("list"));
</script></body></html>
