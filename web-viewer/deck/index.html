<html lang="en">
<head>

  <meta name="theme-color" content="#0b3d2e">
  <title>Deck | Hanafi Learning Deck</title>
  <style>
    html, body { background-color:#03130e; }
    body { min-height:100dvh; }

  <link rel="icon" href="../assets/hanafi-learning-deck-icon-approved.png?rev=20260927staticdeck1" type="image/png">
  <link rel="stylesheet" href="../styles.css?release=v2.3&rev=20260927staticdeck1">

<body id="deckTop">
  <header class="app-header deck-header">
    <p class="eyebrow">Hanafi Learning Deck · v2.3</p>
    <h1>Deck</h1>
    <p class="intro deck-intro">The complete learning card collection, including the main deck and every expansion currently included in the Web App.</p>
    <div class="actions">
      <a class="secondary action-link" href="../">← Home</a>
      <button id="offlineButton" class="primary" type="button">Download for Offline Use</button>

    <p id="status" class="status" role="status" aria-live="polite">Checking offline library…</p>

  <main>
    <nav id="setNav" class="set-nav" aria-label="Card sets"></nav>

    <div class="back-to-top">
      <a class="secondary action-link" href="#deckTop">↑ Back to top</a>

  <script src="app.js?release=v2.3&rev=20260927staticdeck1" defer></script>
