<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" role="img" aria-labelledby="title desc">
<title id="title">I-8. RECITATION &amp; DHIKR WORDS</title>
<desc id="desc">Index card of Islamic and Hanafi terms with plain-English meanings.</desc>
<rect width="1000" height="1400" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="1360" rx="42" fill="none" stroke="#0050a5" stroke-width="8"/>
<rect x="34" y="34" width="932" height="1332" rx="34" fill="none" stroke="#b58b2a" stroke-width="3"/>
<text x="62" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="42" fill="#000000">I-8. RECITATION &amp; DHIKR WORDS</text>
<text x="942" y="153" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="24" fill="#0050a5">INDEX • TERMS &amp; MEANINGS</text>
<line x1="48" y1="186" x2="952" y2="186" stroke="#000000" stroke-width="3"/>
<text x="76" y="238" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">THANA</text>
<text x="90" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">The opening praise recited near the beginning of salah after the opening</text>
<text x="90" y="303" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">takbir.</text>
<text x="76" y="359" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">TA&#x27;AWWUDH</text>
<text x="90" y="396" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Seeking refuge in Allah from Shaytan, beginning A‘udhu billahi min</text>
<text x="90" y="424" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">ash-shaytan ir-rajim.</text>
<text x="76" y="480" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">BASMALAH</text>
<text x="90" y="517" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Saying Bismillahir-Rahmanir-Rahim: “In the name of Allah, the Most</text>
<text x="90" y="545" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Compassionate, the Most Merciful.”</text>
<text x="76" y="601" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">TASBIH</text>
<text x="90" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Glorifying Allah, especially with phrases such as SubhanAllah. The word</text>
<text x="90" y="666" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">is also used for repeated praises in prayer.</text>
<text x="76" y="722" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">SALAWAT</text>
<text x="90" y="759" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Prayers and blessings sent upon Prophet Muhammad ﷺ.</text>
<text x="76" y="815" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">ISTIGHFAR</text>
<text x="90" y="852" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Seeking Allah’s forgiveness, such as by saying Astaghfirullah.</text>
<text x="76" y="908" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">TAWAKKUL</text>
<text x="90" y="945" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Relying upon Allah while still taking the lawful means available to you.</text>
<text x="76" y="1001" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">QUNUT</text>
<text x="90" y="1038" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">A special supplication. In this deck it mainly refers to the du‘a</text>
<text x="90" y="1066" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">recited in the third rak‘ah of Hanafi Witr.</text>
</svg>
