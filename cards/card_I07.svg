<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" role="img" aria-labelledby="title desc">
<title id="title">I-7. FOUNDATIONAL TERMS</title>
<desc id="desc">Index card of Islamic and Hanafi terms with plain-English meanings.</desc>
<rect width="1000" height="1400" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="1360" rx="42" fill="none" stroke="#0050a5" stroke-width="8"/>
<rect x="34" y="34" width="932" height="1332" rx="34" fill="none" stroke="#b58b2a" stroke-width="3"/>
<text x="62" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="48" fill="#000000">I-7. FOUNDATIONAL TERMS</text>
<text x="942" y="153" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="24" fill="#0050a5">INDEX • TERMS &amp; MEANINGS</text>
<line x1="48" y1="186" x2="952" y2="186" stroke="#000000" stroke-width="3"/>
<text x="76" y="238" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">QUR&#x27;AN</text>
<text x="90" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Allah’s revealed Book sent to Prophet Muhammad ﷺ.</text>
<text x="76" y="331" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">SURAH</text>
<text x="90" y="368" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">A chapter of the Qur’an.</text>
<text x="76" y="424" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">AYAH</text>
<text x="90" y="461" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">A verse of the Qur’an. The word also means a sign.</text>
<text x="76" y="517" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">HADITH</text>
<text x="90" y="554" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">A transmitted report about the Prophet’s words, actions, approvals, or</text>
<text x="90" y="582" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">descriptions.</text>
<text x="76" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">SAHIH</text>
<text x="90" y="675" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">A hadith grading meaning sound or authentic. It is also used in the</text>
<text x="90" y="703" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">titles Sahih al-Bukhari and Sahih Muslim.</text>
<text x="76" y="759" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">SHAHADA</text>
<text x="90" y="796" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">The testimony of faith: none is worthy of worship except Allah, and</text>
<text x="90" y="824" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Muhammad is the Messenger of Allah.</text>
<text x="76" y="880" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">MASJID</text>
<text x="90" y="917" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">A mosque; literally a place of prostration.</text>
<text x="76" y="973" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">AMIN</text>
<text x="90" y="1010" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">A supplication meaning roughly “O Allah, answer.” It is said after</text>
<text x="90" y="1038" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">al-Fatihah and is not part of the Qur’an.</text>
<text x="76" y="1094" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">AYAT AL-KURSI</text>
<text x="90" y="1131" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Qur’an 2:255, commonly called the Verse of the Throne.</text>
</svg>
