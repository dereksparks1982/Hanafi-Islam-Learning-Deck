<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" role="img" aria-labelledby="title desc">
<title id="title">I-12. RAMADAN, EID &amp; FUNERAL</title>
<desc id="desc">Index card of Islamic and Hanafi terms with plain-English meanings.</desc>
<rect width="1000" height="1400" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="1360" rx="42" fill="none" stroke="#0050a5" stroke-width="8"/>
<rect x="34" y="34" width="932" height="1332" rx="34" fill="none" stroke="#b58b2a" stroke-width="3"/>
<text x="62" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="48" fill="#000000">I-12. RAMADAN, EID &amp; FUNERAL</text>
<text x="942" y="153" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="24" fill="#0050a5">INDEX • TERMS &amp; MEANINGS</text>
<line x1="48" y1="186" x2="952" y2="186" stroke="#000000" stroke-width="3"/>
<text x="76" y="238" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">RAMADAN</text>
<text x="90" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">The ninth Islamic month, during which fasting is obligatory for Muslims</text>
<text x="90" y="303" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">who meet the conditions.</text>
<text x="76" y="359" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">SAWM</text>
<text x="90" y="396" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Fasting for Allah. In Ramadan this means abstaining from food, drink,</text>
<text x="90" y="424" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">and other fast-breakers from true dawn until sunset.</text>
<text x="76" y="480" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">IFTAR</text>
<text x="90" y="517" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Breaking the fast at sunset.</text>
<text x="76" y="573" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">TARAWIH</text>
<text x="90" y="610" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">The Ramadan night prayer after Isha. The established Hanafi practice in</text>
<text x="90" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">this deck is 20 rak‘ahs.</text>
<text x="76" y="694" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">LAYLAT AL-QADR</text>
<text x="90" y="731" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">The Night of Decree, a blessed night sought especially in the odd nights</text>
<text x="90" y="759" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">of Ramadan’s last ten nights.</text>
<text x="76" y="815" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">EID AL-FITR</text>
<text x="90" y="852" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">The festival and Eid prayer marking the end of Ramadan.</text>
<text x="76" y="908" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">EID AL-ADHA</text>
<text x="90" y="945" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">The festival and Eid prayer during the Hajj season, associated with the</text>
<text x="90" y="973" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">sacrifice.</text>
<text x="76" y="1029" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">JANAZAH</text>
<text x="90" y="1066" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Funeral rites; in this deck the term usually means the funeral prayer</text>
<text x="90" y="1094" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">for a deceased Muslim.</text>
<text x="76" y="1150" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">TALQIN</text>
<text x="90" y="1187" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Gently prompting a dying Muslim to say La ilaha illallah without</text>
<text x="90" y="1215" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">badgering the person.</text>
</svg>
