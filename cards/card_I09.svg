<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" role="img" aria-labelledby="title desc">
<title id="title">I-9. SALAH REPAIR &amp; TIMING</title>
<desc id="desc">Index card of Islamic and Hanafi terms with plain-English meanings.</desc>
<rect width="1000" height="1400" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="1360" rx="42" fill="none" stroke="#0050a5" stroke-width="8"/>
<rect x="34" y="34" width="932" height="1332" rx="34" fill="none" stroke="#b58b2a" stroke-width="3"/>
<text x="62" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="48" fill="#000000">I-9. SALAH REPAIR &amp; TIMING</text>
<text x="942" y="153" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="24" fill="#0050a5">INDEX • TERMS &amp; MEANINGS</text>
<line x1="48" y1="186" x2="952" y2="186" stroke="#000000" stroke-width="3"/>
<text x="76" y="238" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">&#x27;AWRAH</text>
<text x="90" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">The parts of the body that must be covered for salah and in situations</text>
<text x="90" y="303" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">where Islamic law requires covering.</text>
<text x="76" y="359" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">SAJDAT AL-SAHW</text>
<text x="90" y="396" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Two prostrations of forgetfulness used to repair certain accidental</text>
<text x="90" y="424" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">mistakes involving wajib acts in salah.</text>
<text x="76" y="480" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">SAJDAT AL-TILAWAH</text>
<text x="90" y="517" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">A single prostration connected to designated Qur’an verses; it becomes</text>
<text x="90" y="545" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">wajib in Hanafi law when its conditions are met.</text>
<text x="76" y="601" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">SAJDAT AL-SHUKR</text>
<text x="90" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">A prostration of gratitude to Allah after a major blessing or the</text>
<text x="90" y="666" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">removal of a calamity.</text>
<text x="76" y="722" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">QADA</text>
<text x="90" y="759" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Making up an obligatory act of worship after its proper time has passed.</text>
<text x="90" y="787" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">In this deck it usually means a missed prayer.</text>
<text x="76" y="843" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">ZAWAL</text>
<text x="90" y="880" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">The brief time when the sun is at its highest point, immediately before</text>
<text x="90" y="908" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Dhuhr begins.</text>
<text x="76" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">JAHR</text>
<text x="90" y="1001" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Audible Qur’an recitation in salah.</text>
<text x="76" y="1057" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">SIRR</text>
<text x="90" y="1094" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Quiet Qur’an recitation in salah.</text>
<text x="76" y="1150" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">WASWASA</text>
<text x="90" y="1187" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Recurring whisperings or intrusive doubts. In worship, this can mean</text>
<text x="90" y="1215" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">doubts that should not be repeatedly fed or chased.</text>
</svg>
