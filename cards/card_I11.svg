<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" role="img" aria-labelledby="title desc">
<title id="title">I-11. VOLUNTARY PRAYER TERMS</title>
<desc id="desc">Index card of Islamic and Hanafi terms with plain-English meanings.</desc>
<rect width="1000" height="1400" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="1360" rx="42" fill="none" stroke="#0050a5" stroke-width="8"/>
<rect x="34" y="34" width="932" height="1332" rx="34" fill="none" stroke="#b58b2a" stroke-width="3"/>
<text x="62" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="48" fill="#000000">I-11. VOLUNTARY PRAYER TERMS</text>
<text x="942" y="153" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="24" fill="#0050a5">INDEX • TERMS &amp; MEANINGS</text>
<line x1="48" y1="186" x2="952" y2="186" stroke="#000000" stroke-width="3"/>
<text x="76" y="238" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">TAHAJJUD</text>
<text x="90" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Voluntary night prayer, especially prayer offered after sleeping and</text>
<text x="90" y="303" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">then waking during the night.</text>
<text x="76" y="359" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">QIYAM AL-LAYL</text>
<text x="90" y="396" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Night worship after Isha and before Fajr. It is broader than Tahajjud.</text>
<text x="76" y="452" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">ISHRAQ</text>
<text x="90" y="489" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Voluntary prayer near the beginning of the Duha time, after the sunrise</text>
<text x="90" y="517" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">restriction has ended.</text>
<text x="76" y="573" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">DUHA</text>
<text x="90" y="610" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Voluntary morning prayer after the sunrise restriction and before zawal.</text>
<text x="76" y="666" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">AWWABIN</text>
<text x="90" y="703" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">A name used for recommended voluntary prayer after Maghrib; this deck</text>
<text x="90" y="731" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">follows the classical Hanafi six-rak‘ah practice.</text>
<text x="76" y="787" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">ISTIKHARA</text>
<text x="90" y="824" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Prayer and supplication asking Allah to guide you to what is good in a</text>
<text x="90" y="852" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">permissible choice.</text>
<text x="76" y="908" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">SALAT AL-TAWBAH</text>
<text x="90" y="945" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">A voluntary prayer connected with sincere repentance.</text>
<text x="76" y="1001" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">SALAT AL-HAJAH</text>
<text x="90" y="1038" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">A voluntary prayer in which a person asks Allah for a lawful need.</text>
<text x="76" y="1094" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">SALAT AL-TASBIH</text>
<text x="90" y="1131" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">A four-rak‘ah voluntary prayer containing repeated tasbih, 300</text>
<text x="90" y="1159" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">repetitions in the method used in this deck.</text>
</svg>
