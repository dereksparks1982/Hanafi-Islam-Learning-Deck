<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" role="img" aria-labelledby="title desc">
<title id="title">I-6 COMMON ISLAMIC TERMS</title>
<desc id="desc">Index card of Islamic and Hanafi terms with plain-English meanings.</desc>
<rect width="1000" height="1400" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="1360" rx="42" fill="none" stroke="#0050a5" stroke-width="8"/>
<rect x="34" y="34" width="932" height="1332" rx="34" fill="none" stroke="#b58b2a" stroke-width="3"/>
<text x="62" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="48" fill="#000000">I-6. COMMON ISLAMIC TERMS</text>
<text x="942" y="153" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="24" fill="#0050a5">INDEX • TERMS &amp; MEANINGS</text>
<line x1="48" y1="186" x2="952" y2="186" stroke="#000000" stroke-width="3"/>
<text x="76" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">DU’A</text>
<text x="90" y="276" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Supplication: directly asking Allah for help, forgiveness, guidance, or</text>
<text x="90" y="304" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">any good.</text>
<text x="76" y="349" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">DHIKR</text>
<text x="90" y="385" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Remembrance of Allah through words, recitation, praise, and other</text>
<text x="90" y="413" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">acts of remembrance.</text>
<text x="76" y="453" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">TAWBAH</text>
<text x="90" y="489" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Repentance: turning back to Allah, leaving the sin, regretting it, and</text>
<text x="90" y="517" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">sincerely intending not to return to it.</text>
<text x="76" y="562" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">TAQWA</text>
<text x="90" y="598" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Consciousness of Allah that leads a person to obey Him and guard</text>
<text x="90" y="626" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">against sin.</text>
<text x="76" y="671" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">HALAL</text>
<text x="90" y="707" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Permitted or lawful.</text>
<text x="76" y="747" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">HARAM</text>
<text x="90" y="783" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Forbidden or unlawful.</text>
<text x="76" y="823" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">SADAQAH</text>
<text x="90" y="859" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Voluntary charity given for the sake of Allah.</text>
<text x="76" y="904" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">ZAKAT</text>
<text x="90" y="940" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Obligatory charity due on qualifying wealth when its conditions are</text>
<text x="90" y="968" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">met.</text>
<text x="76" y="1007" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">NISAB</text>
<text x="90" y="1043" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">The minimum qualifying amount of wealth used in determining</text>
<text x="90" y="1071" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">whether zakat is due.</text>
<text x="76" y="1111" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">NAFL</text>
<text x="90" y="1147" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Voluntary worship beyond what is obligatory or required.</text>
</svg>
