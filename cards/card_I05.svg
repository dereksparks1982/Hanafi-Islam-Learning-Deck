<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" role="img" aria-labelledby="title desc">
<title id="title">I-5 HANAFI STUDY WORDS</title>
<desc id="desc">Index card of Islamic and Hanafi terms with plain-English meanings.</desc>
<rect width="1000" height="1400" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="1360" rx="42" fill="none" stroke="#0050a5" stroke-width="8"/>
<rect x="34" y="34" width="932" height="1332" rx="34" fill="none" stroke="#b58b2a" stroke-width="3"/>
<text x="62" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="48" fill="#000000">I-5. HANAFI STUDY WORDS</text>
<text x="942" y="153" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="24" fill="#0050a5">INDEX • TERMS &amp; MEANINGS</text>
<line x1="48" y1="186" x2="952" y2="186" stroke="#000000" stroke-width="3"/>
<text x="76" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">FIQH</text>
<text x="90" y="276" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">The understanding and study of practical Islamic rulings and how</text>
<text x="90" y="304" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">they apply.</text>
<text x="76" y="349" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">MADHHAB</text>
<text x="90" y="385" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">A disciplined school and method of Islamic law. The Hanafi madhhab</text>
<text x="90" y="413" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">is one of the four major Sunni schools.</text>
<text x="76" y="458" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">HANAFI</text>
<text x="90" y="494" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Relating to the school of Islamic law associated with Imam Abu Hanifa</text>
<text x="90" y="522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">and developed by his students and later jurists.</text>
<text x="76" y="567" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">FATWA</text>
<text x="90" y="603" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">A legal answer or opinion given by a qualified scholar in response to a</text>
<text x="90" y="631" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">religious question.</text>
<text x="76" y="676" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">MUFTI</text>
<text x="90" y="712" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">A qualified scholar who gives fatwas.</text>
<text x="76" y="757" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">IJTIHAD</text>
<text x="90" y="793" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Qualified scholarly effort used to derive or determine a ruling from</text>
<text x="90" y="821" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">the Islamic sources.</text>
<text x="76" y="861" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">QIYAS</text>
<text x="90" y="897" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Legal analogy: applying a known ruling to a new case because they</text>
<text x="90" y="925" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">share a legally relevant cause.</text>
<text x="76" y="970" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">IJMA’</text>
<text x="90" y="1006" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Scholarly consensus. It is one of the recognized sources used in</text>
<text x="90" y="1034" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Islamic legal reasoning.</text>
<text x="76" y="1079" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">USUL AL-FIQH</text>
<text x="90" y="1115" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">The principles and methods used to understand the legal sources and</text>
<text x="90" y="1143" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">derive rulings from them.</text>
</svg>
