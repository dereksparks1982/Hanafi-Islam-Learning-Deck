<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" role="img" aria-labelledby="title desc">
<title id="title">I-4 PEOPLE &amp; PRACTICE</title>
<desc id="desc">Index card of Islamic and Hanafi terms with plain-English meanings.</desc>
<rect width="1000" height="1400" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="1360" rx="42" fill="none" stroke="#0050a5" stroke-width="8"/>
<rect x="34" y="34" width="932" height="1332" rx="34" fill="none" stroke="#b58b2a" stroke-width="3"/>
<text x="62" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="48" fill="#000000">I-4. PEOPLE &amp; PRACTICE</text>
<text x="942" y="153" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="24" fill="#0050a5">INDEX • TERMS &amp; MEANINGS</text>
<line x1="48" y1="186" x2="952" y2="186" stroke="#000000" stroke-width="3"/>
<text x="76" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">IMAM</text>
<text x="90" y="276" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">The person leading the congregational prayer.</text>
<text x="76" y="321" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">MUQTADI</text>
<text x="90" y="357" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">A person praying behind and following an imam.</text>
<text x="76" y="402" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">JAMA’AH</text>
<text x="90" y="438" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">A congregation praying together.</text>
<text x="76" y="483" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">MASBUQ</text>
<text x="90" y="519" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">A latecomer who joins the imam after missing part of the</text>
<text x="90" y="547" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">congregational prayer.</text>
<text x="76" y="592" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">ADHAN</text>
<text x="90" y="628" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">The call announcing that the time for an obligatory prayer has</text>
<text x="90" y="656" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">entered.</text>
<text x="76" y="696" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">IQAMAH</text>
<text x="90" y="732" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">The second call given immediately before the congregational</text>
<text x="90" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">obligatory prayer begins.</text>
<text x="76" y="805" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">MU’ADHDHIN</text>
<text x="90" y="841" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">The person who gives the adhan.</text>
<text x="76" y="886" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">QIBLAH</text>
<text x="90" y="922" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">The direction of the Ka‘bah in Makkah, toward which Muslims face in</text>
<text x="90" y="948" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">salah.</text>
<text x="76" y="988" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">NIYYAH</text>
<text x="90" y="1024" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Intention in the heart to perform an act of worship.</text>
<text x="76" y="1069" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">KHUTBAH</text>
<text x="90" y="1105" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">A formal sermon, such as the sermon delivered before the Jumu‘ah</text>
<text x="90" y="1133" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">prayer.</text>
</svg>
