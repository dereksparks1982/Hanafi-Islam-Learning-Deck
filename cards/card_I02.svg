<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" role="img" aria-labelledby="title desc">
<title id="title">I-2 PURIFICATION TERMS</title>
<desc id="desc">Index card of Islamic and Hanafi terms with plain-English meanings.</desc>
<rect width="1000" height="1400" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="1360" rx="42" fill="none" stroke="#0050a5" stroke-width="8"/>
<rect x="34" y="34" width="932" height="1332" rx="34" fill="none" stroke="#b58b2a" stroke-width="3"/>
<text x="62" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="48" fill="#000000">I-2. PURIFICATION TERMS</text>
<text x="942" y="153" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="24" fill="#0050a5">INDEX • TERMS &amp; MEANINGS</text>
<line x1="48" y1="186" x2="952" y2="186" stroke="#000000" stroke-width="3"/>
<text x="76" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">TAHARAH</text>
<text x="90" y="276" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Purity or purification, including ritual purity and removal of physical</text>
<text x="90" y="304" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">impurity.</text>
<text x="76" y="349" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">WUDU</text>
<text x="90" y="385" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">The minor ritual washing required for salah and certain other acts of</text>
<text x="90" y="413" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">worship.</text>
<text x="76" y="458" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">GHUSL</text>
<text x="90" y="494" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">A full ritual bath required after major ritual impurity and in certain</text>
<text x="90" y="522" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">other situations.</text>
<text x="76" y="562" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">TAYAMMUM</text>
<text x="90" y="598" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Dry purification using clean earth or a qualifying earth-like substance</text>
<text x="90" y="626" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">when water cannot be used.</text>
<text x="76" y="666" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">NAJASAH</text>
<text x="90" y="702" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Physical impurity, such as urine or blood, that must be removed when</text>
<text x="90" y="730" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">required for worship.</text>
<text x="76" y="775" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">HADATH</text>
<text x="90" y="811" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">A state of ritual impurity that requires wudu or ghusl. It is not the</text>
<text x="90" y="839" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">same thing as physical dirt.</text>
<text x="76" y="884" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">MA’DHUR</text>
<text x="90" y="920" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">An excused person under Hanafi law whose chronic condition</text>
<text x="90" y="948" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">continuously causes something that would normally break wudu.</text>
<text x="76" y="993" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">ISTINJA</text>
<text x="90" y="1029" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Cleaning the private areas after using the toilet.</text>
<text x="76" y="1074" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#0050a5">MASAH</text>
<text x="90" y="1110" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#000000">Wiping with wet hands, such as wiping part of the head during wudu.</text>
</svg>
