<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" role="img" aria-labelledby="title desc">
<title id="title">I-13. TRAVEL &amp; SPECIAL WORSHIP</title>
<desc id="desc">Index card of Islamic and Hanafi terms with plain-English meanings.</desc>
<rect width="1000" height="1400" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="1360" rx="42" fill="none" stroke="#0050a5" stroke-width="8"/>
<rect x="34" y="34" width="932" height="1332" rx="34" fill="none" stroke="#b58b2a" stroke-width="3"/>
<text x="62" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="42" fill="#000000">I-13. TRAVEL &amp; SPECIAL WORSHIP</text>
<text x="942" y="153" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="24" fill="#0050a5">INDEX • TERMS &amp; MEANINGS</text>
<line x1="48" y1="186" x2="952" y2="186" stroke="#000000" stroke-width="3"/>
<text x="76" y="238" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">HAJJ</text>
<text x="90" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">The pilgrimage to Makkah and its sacred sites performed in its appointed</text>
<text x="90" y="303" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">season by Muslims who are able.</text>
<text x="76" y="359" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">QASR</text>
<text x="90" y="396" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Shortening the 4-rak‘ah fard prayers of Dhuhr, Asr, and Isha to 2</text>
<text x="90" y="424" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">rak‘ahs for a qualifying Hanafi traveler.</text>
<text x="76" y="480" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">&#x27;ARAFAH</text>
<text x="90" y="517" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">The plain near Makkah where standing on the ninth day of the Hajj season</text>
<text x="90" y="545" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">is a central rite of Hajj.</text>
<text x="76" y="601" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">MUZDALIFAH</text>
<text x="90" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">A sacred Hajj site between ‘Arafah and Mina; Hanafi prayer-combining</text>
<text x="90" y="666" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">rules have a special Hajj exception there.</text>
<text x="76" y="722" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">KUSUF</text>
<text x="90" y="759" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">A solar eclipse. Salat al-Kusuf is the special prayer offered during a</text>
<text x="90" y="787" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">solar eclipse.</text>
<text x="76" y="843" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">ISTISQA</text>
<text x="90" y="880" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">Seeking rain from Allah through repentance, du‘a, and, according to a</text>
<text x="90" y="908" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">recognized Hanafi position, a special prayer.</text>
<text x="76" y="964" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#0050a5">SALAT AL-KHAWF</text>
<text x="90" y="1001" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">The prayer of fear: a special arrangement for obligatory prayer during</text>
<text x="90" y="1029" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#000000">serious armed danger.</text>
</svg>
