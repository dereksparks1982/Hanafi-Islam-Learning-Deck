<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b3d2e">
  <meta name="description" content="Offline study viewer for the Hanafi Learning Deck.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hanafi Deck">
  <title>Hanafi Learning Deck</title>
  <link rel="manifest" href="manifest.webmanifest?release=v1.7">
  <link rel="icon" href="icon.svg?release=v1.7" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png?release=v1.7">
  <link rel="stylesheet" href="styles.css?release=v1.7">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">Hanafi Learning Deck · v1.7</p>
      <h1>Carry the deck with you.</h1>
      <p class="intro">Browse the current card library online, or download all 209 current cards for offline study.</p>
    </div>
    <div class="actions" aria-label="App actions">
      <button id="installButton" class="secondary" hidden>Install App</button>
      <button id="iosInstallButton" class="secondary" hidden>Install on iPhone</button>
      <button id="offlineButton" class="primary">Download for Offline Use</button>
      <button id="refreshButton" class="secondary" disabled>Update Deck</button>
    </div>
    <p id="iosInstallInstructions" class="status" role="status" aria-live="polite" hidden></p>
    <p id="status" class="status" role="status" aria-live="polite">Checking offline library…</p>
  </header>

  <main>
    <nav id="setNav" class="set-nav" aria-label="Card sets"></nav>
    <section id="library" class="library" aria-live="polite"></section>
  </main>

  <footer>
    <p>No account. No advertising. No behavioral tracking. Repository card images remain authoritative.</p>
  </footer>

  <script>
    (() => {
      const ua = navigator.userAgent || "";
      const isiOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const standalone = navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
      if (!isiOS || standalone) return;

      const button = document.getElementById("iosInstallButton");
      const instructions = document.getElementById("iosInstallInstructions");
      button.hidden = false;

      button.addEventListener("click", () => {
        const isSafari = /Safari/i.test(ua) && /Version\/\d+/i.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);
        instructions.textContent = isSafari
          ? "To install: tap Safari’s Share button, choose Add to Home Screen, keep Open as Web App enabled, then tap Add."
          : "This page is open inside another app. Open this same page in Safari first. Then tap Safari’s Share button, choose Add to Home Screen, keep Open as Web App enabled, and tap Add.";
        instructions.hidden = false;
      });
    })();
  </script>
  <script src="app.js?release=v1.7" defer></script>
</body>
</html>
