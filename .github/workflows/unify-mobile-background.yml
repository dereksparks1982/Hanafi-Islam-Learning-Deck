name: Prevent refresh layout flash

on:
  push:
    paths:
      - '.github/workflows/unify-mobile-background.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prevent-layout-flash:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Keep card library hidden until final layout is ready
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path('web-viewer/index.html')
          text = index.read_text(encoding='utf-8')

          marker = '  <link rel="stylesheet" href="mobile-background.css?rev=20260923mobile1">\n'
          anti_flash = '''  <style>
    #setNav.card-layout-pending,
    #library.card-layout-pending { visibility: hidden; }
  </style>
'''
          if 'card-layout-pending' not in text:
              if marker not in text:
                  raise SystemExit('mobile stylesheet marker not found in Home')
              text = text.replace(marker, marker + anti_flash, 1)
              text = text.replace('id="setNav" class="set-nav"', 'id="setNav" class="set-nav card-layout-pending"', 1)
              text = text.replace('id="library" class="library"', 'id="library" class="library card-layout-pending"', 1)

          text = text.replace('card-set-collapse.js?rev=20260923c', 'card-set-collapse.js?rev=20260923d')
          index.write_text(text, encoding='utf-8')

          script = Path('web-viewer/card-set-collapse.js')
          js = script.read_text(encoding='utf-8')
          reveal = '''

  document.getElementById("setNav")?.classList.remove("card-layout-pending");
  document.getElementById("library")?.classList.remove("card-layout-pending");
'''
          if 'classList.remove("card-layout-pending")' not in js:
              close = '\n})();\n'
              if close not in js:
                  raise SystemExit('card-set-collapse IIFE ending not found')
              js = js.replace(close, reveal + close, 1)
              script.write_text(js, encoding='utf-8')
          PY

      - name: Commit refresh flash fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Abdullāh ibn al-Malik al-Jazzār'
          git config user.email 'dereksparks1982@gmail.com'
          git add web-viewer/index.html web-viewer/card-set-collapse.js
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Prevent old card layout flash on refresh'
          git push origin HEAD:main
