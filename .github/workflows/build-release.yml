name: Build Hanafi Learning Deck v1

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "build_deck.py"
      - "README.md"
      - "VERSION_1_NOTES.md"
      - "AUDIT_AND_SOURCES.md"
      - "IMAM_REVIEW_NOTES.md"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install fonts and Arabic text support
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-noto-core libraqm0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Build cards, sheets, QA, and release ZIP
        run: |
          python build_deck.py

      - name: Publish generated cards and sheets to repository
        run: |
          rm -rf cards sheets
          cp -R build/cards ./cards
          cp -R build/sheets ./sheets
          cp build/contact_sheet.png ./contact_sheet.png
          cp build/QA_REPORT.txt ./QA_REPORT.txt
          cp build/CARD_MANIFEST.txt ./CARD_MANIFEST.txt
          git config user.name "Hanafi Learning Deck Builder"
          git config user.email "actions@users.noreply.github.com"
          git add cards sheets contact_sheet.png QA_REPORT.txt CARD_MANIFEST.txt
          if git diff --cached --quiet; then
            echo "Generated assets are already current."
          else
            git commit -m "Generate Hanafi Learning Deck v1.0 assets [skip ci]"
            git push
          fi

      - name: Create or update Version 1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0               dist/Hanafi-Learning-Deck-v1.0.zip               dist/SHA256SUMS.txt               --clobber
          else
            gh release create v1.0.0               dist/Hanafi-Learning-Deck-v1.0.zip               dist/SHA256SUMS.txt               --title "Hanafi Learning Deck — Version 1.0"               --notes-file VERSION_1_NOTES.md
          fi
