name: Import Approved Library Background

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-approved-library-background.yml'

permissions:
  contents: write

jobs:
  import-background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore exact approved PNG
        env:
          URL_B64: ''
        run: |
          set -euo pipefail
          SOURCE_URL="$(printf '%s' "$URL_B64" | base64 -d)"
          curl -L --fail --retry 3 --retry-delay 2 "$SOURCE_URL" -o web-viewer/assets/hanafi-advanced-library-background-approved.png
          test "$(stat -c%s web-viewer/assets/hanafi-advanced-library-background-approved.png)" = "2754637"
          echo '0d01a8ddb2f0e4dd297e6ef065c0a840f602f1d7e6001cb9bf6e3f76fd575349  web-viewer/assets/hanafi-advanced-library-background-approved.png' | sha256sum -c -

      - name: Commit exact asset and remove importer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-viewer/assets/hanafi-advanced-library-background-approved.png
          git rm .github/workflows/import-approved-library-background.yml
          git commit -m 'Restore exact approved Advanced Learner Library background'
          git push
