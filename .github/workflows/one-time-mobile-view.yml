name: One-time mobile card view

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-mobile-view.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build mobile-friendly galleries and clean redundant download
        run: |
          python - <<'PY'
          from pathlib import Path
          import html

          repo = 'https://github.com/dereksparks1982/Hanafi-Islam-Learning-Deck'
          root = Path('.')
          out = root / 'mobile-view'
          out.mkdir(exist_ok=True)

          sets = [
              ('Main Deck', 'Main-Deck.md', 'cards/card_*.png'),
              ('Sacred Places', 'Sacred-Places.md', 'Sacred-Places-Expansion/card_*.png'),
              ('99 Names of Allah', '99-Names-of-Allah.md', '99-Names-of-Allah-Expansion/card_*.png'),
              ('Arabic Alphabet', 'Arabic-Alphabet.md', 'Arabic-Alphabet-Expansion/cards/card_*.png'),
          ]

          index = [
              '# Mobile-Friendly Card View',
              '',
              'These pages are for reading the deck inside the GitHub mobile app without the app\'s bottom navigation covering the source text.',
              '',
              '**The printable card files are unchanged.** These pages simply display the existing cards slightly narrower, higher on the page, with extra breathing room below each card.',
              '',
          ]

          for title, filename, pattern in sets:
              files = sorted(root.glob(pattern))
              page = [
                  f'# {title} — Mobile View',
                  '',
                  f'{len(files)} cards. This is a viewing page only; the original printable PNG files remain authoritative.',
                  '',
                  '[Back to mobile-view index](README.md)',
                  '',
              ]
              for n, p in enumerate(files, 1):
                  rel = '../' + p.as_posix()
                  alt = html.escape(p.stem.replace('_', ' '), quote=True)
                  page.extend([
                      f'## Card {n:03d}',
                      '',
                      f'<p align="center"><img src="{rel}" width="88%" alt="{alt}"></p>',
                      '',
                      f'<p align="center"><a href="{rel}">Open printable original</a></p>',
                      '',
                      '<br><br><br><br>',
                      '',
                      '---',
                      '',
                  ])
              (out / filename).write_text('\n'.join(page), encoding='utf-8')
              index.append(f'- **[{title}]({filename})** — {len(files)} cards')

          index.extend([
              '',
              '### Why this exists',
              '',
              'When an individual PNG is opened directly in the GitHub iPhone app, GitHub places a floating navigation bar over the bottom of the image. On cards with source text near the bottom, that can hide part of the card.',
              '',
              'These gallery pages avoid changing the printable deck itself. They render each existing card at a slightly narrower width inside a normal scrollable page, so the full lower text can be moved above the app controls.',
              '',
          ])
          (out / 'README.md').write_text('\n'.join(index), encoding='utf-8')

          # Remove the redundant standalone Arabic expansion ZIP. The expansion
          # already lives in its own folder and is also included in the normal
          # GitHub full-repository ZIP.
          redundant = root / 'Arabic-Alphabet-Expansion-v1.5.zip'
          if redundant.exists():
              redundant.unlink()

          # Keep the README accurate and make the mobile view easy to find.
          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              '**Complete current v1.4 R3 ZIP:**',
              '**Complete current v1.5 ZIP:**'
          )
          complete_line = '- **Complete current v1.5 ZIP:** https://github.com/dereksparks1982/Hanafi-Islam-Learning-Deck/archive/refs/heads/main.zip\n'
          mobile_line = '- **Mobile-friendly card view:** https://github.com/dereksparks1982/Hanafi-Islam-Learning-Deck/tree/main/mobile-view\n'
          if mobile_line not in text and complete_line in text:
              text = text.replace(complete_line, complete_line + mobile_line, 1)
          text = text.replace(
              'Future expansion packs remain in their own folders and downloadable packages rather than being mixed into the main deck.',
              'Future expansion packs remain in their own folders rather than being mixed into the main deck.'
          )
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Commit mobile view and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md mobile-view Arabic-Alphabet-Expansion-v1.5.zip
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add mobile card view and remove redundant Arabic ZIP"
            git push
          fi
