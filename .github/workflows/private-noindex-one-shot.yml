name: Private library noindex one-shot

on:
  push:
    paths:
      - '.github/workflows/private-noindex-one-shot.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add noindex to private library
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web-viewer/advanced-library/index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">'
          if marker not in text:
              anchor = '  <meta name="theme-color" content="#03130e">\n'
              if anchor not in text:
                  raise SystemExit('theme-color anchor not found')
              text = text.replace(anchor, anchor + '  ' + marker + '\n', 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Validate private noindex
        shell: bash
        run: |
          grep -Fq '<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">' web-viewer/advanced-library/index.html
          grep -Fq 'hanafi-advanced-library-unlocked' web-viewer/advanced-library/index.html

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/private-noindex-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-viewer/advanced-library/index.html .github/workflows/private-noindex-one-shot.yml
          git commit -m 'Block private library from search indexing'
          git push origin main
