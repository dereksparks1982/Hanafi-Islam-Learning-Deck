name: Temporary offline PWA builder

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-build-offline-pwa.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract validated PWA payload
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pwa_payload.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/pwa_payload.b64 | tar -xzf -

      - name: Validate PWA
        shell: bash
        run: |
          set -euo pipefail
          node --check pwa/app.js
          node --check pwa/sw.js
          python3 -m json.tool pwa/manifest.webmanifest >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          text = Path('pwa/app.js').read_text(encoding='utf-8')
          match = re.search(r'const SETS = (\[[\s\S]*?\]);\nconst CARD_URLS', text)
          assert match, 'SETS inventory not found'
          sets = json.loads(match.group(1))
          urls = [url for group in sets for url in group['files']]
          assert len(urls) == 208, len(urls)
          assert len(set(urls)) == 208, 'duplicate card URL'
          missing = [url for url in urls if not Path(url).is_file()]
          assert not missing, f'missing card assets: {missing[:5]}'
          print('PASS: 208 unique card assets found')
          PY
          test "$(git status --short | awk '{print $2}' | grep -v '^pwa/' | wc -l)" -eq 0

      - name: Commit PWA foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa
          git diff --cached --quiet && exit 0
          git commit -m "Add offline PWA foundation"
          git push origin HEAD:main
