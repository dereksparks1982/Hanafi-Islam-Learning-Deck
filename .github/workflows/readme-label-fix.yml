name: Fix Arabic Alphabet download label

on:
  push:
    paths:
      - '.github/workflows/readme-label-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove ZIP from README label only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          old = '**Arabic Alphabet v1.5 ZIP:**'
          new = '**Arabic Alphabet v1.5:**'
          if old not in s:
              raise SystemExit('Target label not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit label fix and remove temporary workflow
        run: |
          rm -f .github/workflows/readme-label-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/readme-label-fix.yml
          git commit -m "Remove ZIP from Arabic Alphabet download label"
          git push
