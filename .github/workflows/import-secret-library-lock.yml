name: Import Secret Library Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-secret-library-lock.yml'

permissions:
  contents: write

jobs:
  import-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore exact approved lock artwork
        env:
          URL_B64: ''
        run: |
          set -euo pipefail
          SOURCE_URL="$(printf '%s' "$URL_B64" | base64 -d)"
          curl -L --fail --retry 3 --retry-delay 2 "$SOURCE_URL" -o web-viewer/assets/hanafi-secret-library-lock-approved.png
          test "$(stat -c%s web-viewer/assets/hanafi-secret-library-lock-approved.png)" = "3156206"
          echo 'b851a76e5b43a7d0216e80e47cced42e1a4123da35f00768de4c9b01300b512e  web-viewer/assets/hanafi-secret-library-lock-approved.png' | sha256sum -c -

      - name: Commit exact asset and remove importer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-viewer/assets/hanafi-secret-library-lock-approved.png
          git rm .github/workflows/import-secret-library-lock.yml
          git commit -m 'Add exact approved Secret Library lock artwork'
          git push
