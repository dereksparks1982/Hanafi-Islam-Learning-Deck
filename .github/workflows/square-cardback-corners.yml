name: Square card back corners

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/square-cardback-corners.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Make only the card corners square
        run: |
          python - <<'PY'
          from PIL import Image
          p = 'card-back/CardBack.png'
          im = Image.open(p).convert('RGBA')
          # Only replace transparency outside the rounded white card with solid white.
          # All already-opaque artwork and the rounded green/gold border remain pixel-identical.
          bg = Image.new('RGBA', im.size, (255,255,255,255))
          bg.alpha_composite(im)
          bg.convert('RGB').save(p, 'PNG', optimize=True)
          PY
      - name: Commit corrected card back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card-back/CardBack.png
          if git diff --cached --quiet; then
            echo "No image change needed"
          else
            git commit -m "Square card back outer corners only"
            git push
          fi
