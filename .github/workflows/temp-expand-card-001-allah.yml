name: TEMP Correct Card 1 Typography

on:
  push:
    paths:
      - '.github/workflows/temp-expand-card-001-allah.yml'

permissions:
  contents: write

jobs:
  correct-card-001:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          python -m pip install --quiet pillow numpy

      - name: Correct Card 1 source wording for reliable rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('source/cards_001_025.json')
          cards = json.loads(p.read_text(encoding='utf-8'))
          card = cards[0]
          if card.get('n') != 1 or card.get('title') != 'ALLAH':
              raise SystemExit('Card 1 source gate failed')
          card['bullets'] = [
              ['NAME', 'Allah is the Arabic name Muslims use for the one true God: the Creator worshipped by Ibrahim (Abraham), Ishaq (Isaac), Musa (Moses), Isa (Jesus), and Prophet Muhammad.'],
              ['ARABIC', 'Arabic ilāh means “a god” or “deity.” Allah refers to God, the One worthy of worship. It is not a separate “Muslim god”; Arabic-speaking Christians also use Allah for God.'],
              ["QUR'AN", 'Allah says: “Indeed, I am Allah. There is no deity except Me, so worship Me.” (Qur’an 20:14)'],
              ['ONE', 'Surah al-Ikhlāṣ begins: “Say: He is Allah, One. Allah, the Eternal Refuge.” (Qur’an 112:1–2)'],
          ]
          p.write_text(json.dumps(cards, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Render corrected Card 1 and restore Arabic header
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import build_deck
          from tools.apply_main_deck_arabic_headers import update_card
          card = json.loads(Path('source/cards_001_025.json').read_text(encoding='utf-8'))[0]
          build_deck.render_card(card).save('cards/card_001.png', 'PNG', optimize=True)
          if not update_card(card, 'الله'):
              raise SystemExit('Arabic header update failed')
          PY

      - name: Rebuild affected sheet and contact sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import math
          card_paths = sorted(Path('cards').glob('card_*.png'))
          if len(card_paths) != 147 or card_paths[0].name != 'card_000.png':
              raise SystemExit('Main deck ordering gate failed')
          sheet_w, sheet_h = 2060, 2860
          slot_w, slot_h = 970, 1358
          gap_x, gap_y = 40, 40
          start_x, start_y = 40, 52
          sheet = Image.new('RGB', (sheet_w, sheet_h), 'white')
          for j, p in enumerate(card_paths[:4]):
              with Image.open(p) as src:
                  im = src.convert('RGB')
                  scale = min(slot_w / im.width, slot_h / im.height)
                  nw, nh = round(im.width*scale), round(im.height*scale)
                  im = im.resize((nw, nh), Image.Resampling.LANCZOS)
              col, row = j % 2, j // 2
              sx = start_x + col*(slot_w+gap_x)
              sy = start_y + row*(slot_h+gap_y)
              sheet.paste(im, (sx+(slot_w-nw)//2, sy+(slot_h-nh)//2))
          sheet.save('sheets/sheet_01.png', 'PNG', optimize=True)
          cols, cw, ch = 8, 180, 252
          rows = math.ceil(len(card_paths)/cols)
          contact = Image.new('RGB', (cols*cw, rows*ch), 'white')
          for i,p in enumerate(card_paths):
              with Image.open(p) as src:
                  im = src.convert('RGB')
                  im.thumbnail((cw-6,ch-6), Image.Resampling.LANCZOS)
              x=(i%cols)*cw+(cw-im.width)//2
              y=(i//cols)*ch+(ch-im.height)//2
              contact.paste(im,(x,y))
          contact.save('contact_sheet.png','PNG',optimize=True)
          PY

      - name: Verify and export corrected Card 1
        run: |
          set -euo pipefail
          echo '6e4f9965413a53912553a49fda1f09a3fa49691a1a6760e7759fe2072c55ec88  cards/card_000.png' | sha256sum -c -
          python - <<'PY'
          from PIL import Image
          assert Image.open('cards/card_001.png').size == (1000,1400)
          print('PASS: corrected Card 1 dimensions and protected Card 00')
          PY

      - name: Upload corrected Card 1 for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: card-001-corrected-visual-qa
          path: cards/card_001.png
          retention-days: 1

      - name: Commit corrected Card 1
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/cards_001_025.json cards/card_001.png sheets/sheet_01.png contact_sheet.png
          git commit -m 'Correct Card 1 mixed-script typography'
          git push origin main
