name: TEMP Card 1 Visual QA

on:
  push:
    paths:
      - '.github/workflows/temp-expand-card-001-allah.yml'

permissions:
  contents: read

jobs:
  export-card-001:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Upload Card 1 for visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: card-001-visual-qa
          path: cards/card_001.png
          retention-days: 1
