name: Add Arabic 1080p Media Copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-arabic-1080.yml'

permissions:
  contents: write

jobs:
  patch-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add Arabic 1080p no-subtitles copy without touching player logic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('web-viewer/media/index.html')
          text = path.read_text()

          replacements = [
              ('<strong>Arabic version · 480p / 360p</strong>',
               '<strong>Arabic version · 1080p / 480p / 360p</strong>',
               'Arabic fact heading'),
              ('<span><span lang="ar" dir="rtl">الرسالة</span> / <em>Al-Risalah</em> · about 3h 27m · Abdallah Gheith, Mona Wassef · Arabic subtitles are visible in the project copies</span>',
               '<span><span lang="ar" dir="rtl">الرسالة</span> / <em>Al-Risalah</em> · about 3h 27m · Abdallah Gheith, Mona Wassef · 1080p no-subtitles copy included for Arabic listening study; older project copies remain available</span>',
               'Arabic fact description'),
              ('defaultQuality: "480p",',
               'defaultQuality: "1080p · No subtitles",',
               'Arabic default quality'),
          ]

          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'{label} did not match exactly once; refusing to patch.')
              text = text.replace(old, new, 1)

          marker = '"480p": {'
          if text.count(marker) != 1:
              raise SystemExit(f'Arabic 480p marker matched {text.count(marker)} times; refusing to patch.')

          marker_pos = text.index(marker)
          nearby = text[marker_pos:marker_pos + 700]
          expected_id = '1Z9eyOrXjrdKEHjt3_sL_up7rR1V-zzyO'
          if expected_id not in nearby:
              raise SystemExit('Arabic 480p marker is not the expected Drive source; refusing to patch.')

          line_start = text.rfind('\n', 0, marker_pos) + 1
          indent = text[line_start:marker_pos]
          child = indent + '  '
          block = (
              f'{indent}"1080p · No subtitles": {{\n'
              f'{child}preview: "https://drive.google.com/file/d/1fWyfniNFtsGuZenL7oO7mtQmLMTaZhh9/preview",\n'
              f'{child}view: "https://drive.google.com/file/d/1fWyfniNFtsGuZenL7oO7mtQmLMTaZhh9/view?usp=sharing",\n'
              f'{child}title: "Al-Risalah (1976) · Arabic version · 1080p · No subtitles"\n'
              f'{indent}}},\n'
          )
          text = text[:line_start] + block + text[line_start:]
          path.write_text(text)
          PY

      - name: Verify player implementation remains locked
        run: |
          grep -F '.media-player.ios-drive-stage iframe{inset:auto;width:1024px;height:576px;transform-origin:top left;z-index:1}' web-viewer/media/index.html
          grep -F 'const baseWidth = 1024;' web-viewer/media/index.html
          grep -F 'driveFrame.style.transform = `scale(${scale})`;' web-viewer/media/index.html
          grep -F '1fWyfniNFtsGuZenL7oO7mtQmLMTaZhh9/preview' web-viewer/media/index.html
          grep -F 'defaultQuality: "1080p · No subtitles",' web-viewer/media/index.html

      - name: Commit narrow Media data update
        run: |
          if git diff --quiet -- web-viewer/media/index.html; then
            echo 'No Media changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-viewer/media/index.html
          git commit -m 'Add Arabic 1080p no-subtitles Message copy'
          git push
