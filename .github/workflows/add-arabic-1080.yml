name: Add Arabic 1080p Media Copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-arabic-1080.yml'

permissions:
  contents: write

jobs:
  patch-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Repair Arabic 1080p source placement only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('web-viewer/media/index.html')
          text = path.read_text()

          arabic_marker = '        arabic: {'
          default_marker = '          defaultQuality: "1080p · No subtitles",'
          quality_marker = '          qualities: {'
          rogue_marker = '"1080p · No subtitles": {'
          title_marker = 'title: "Al-Risalah (1976) · Arabic version · 1080p · No subtitles"'
          source_id = '1fWyfniNFtsGuZenL7oO7mtQmLMTaZhh9'

          if text.count(arabic_marker) != 1:
              raise SystemExit('Arabic version object is not unique; refusing to patch.')
          if text.count(default_marker) != 1:
              raise SystemExit('Arabic 1080p default marker is not unique; refusing to patch.')
          if text.count(title_marker) != 1 or text.count(source_id) != 2:
              raise SystemExit('Arabic 1080p source markers are not exactly as expected; refusing to patch.')

          arabic_start = text.index(arabic_marker)
          default_pos = text.index(default_marker, arabic_start)
          rogue_pos = text.index(rogue_marker, arabic_start, default_pos)
          title_pos = text.index(title_marker, rogue_pos, default_pos)
          close_pos = text.index('},', title_pos) + 2
          rogue_line_start = text.rfind('\n', arabic_start, rogue_pos) + 1
          rogue_line_end = text.find('\n', close_pos)
          if rogue_line_end == -1:
              raise SystemExit('Could not locate rogue 1080p block ending; refusing to patch.')
          rogue_line_end += 1

          # Remove only the misplaced 1080p property block.
          text = text[:rogue_line_start] + text[rogue_line_end:]

          # Insert the same source inside the Arabic qualities object.
          arabic_start = text.index(arabic_marker)
          qualities_pos = text.index(quality_marker, arabic_start)
          insert_pos = text.find('\n', qualities_pos) + 1
          block = (
              '            "1080p · No subtitles": {\n'
              '              preview: "https://drive.google.com/file/d/1fWyfniNFtsGuZenL7oO7mtQmLMTaZhh9/preview",\n'
              '              view: "https://drive.google.com/file/d/1fWyfniNFtsGuZenL7oO7mtQmLMTaZhh9/view?usp=sharing",\n'
              '              title: "Al-Risalah (1976) · Arabic version · 1080p · No subtitles"\n'
              '            },\n'
          )
          text = text[:insert_pos] + block + text[insert_pos:]

          # State assertions before writing.
          arabic_start = text.index(arabic_marker)
          default_pos = text.index(default_marker, arabic_start)
          qualities_pos = text.index(quality_marker, default_pos)
          q1080_pos = text.index(rogue_marker, qualities_pos)
          q480_pos = text.index('"480p": {', q1080_pos)
          if not (arabic_start < default_pos < qualities_pos < q1080_pos < q480_pos):
              raise SystemExit('Arabic quality ordering is not valid; refusing to write.')

          path.write_text(text)
          PY

      - name: Verify Media player remains locked and 1080p is selectable
        run: |
          grep -F '.media-player.ios-drive-stage iframe{inset:auto;width:1024px;height:576px;transform-origin:top left;z-index:1}' web-viewer/media/index.html
          grep -F 'const baseWidth = 1024;' web-viewer/media/index.html
          grep -F 'driveFrame.style.transform = `scale(${scale})`;' web-viewer/media/index.html
          grep -F 'defaultQuality: "1080p · No subtitles",' web-viewer/media/index.html
          grep -F '"1080p · No subtitles": {' web-viewer/media/index.html

      - name: Commit repaired source data
        run: |
          if git diff --quiet -- web-viewer/media/index.html; then
            echo 'No Media changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-viewer/media/index.html
          git commit -m 'Fix Arabic 1080p source placement'
          git push
