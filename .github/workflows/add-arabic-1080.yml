name: Add Arabic 1080p Media Copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-arabic-1080.yml'

permissions:
  contents: write

jobs:
  patch-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Repair Arabic 1080p source placement only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('web-viewer/media/index.html')
          text = path.read_text()

          old = '''        arabic: {
          label: "العربية",

            "1080p · No subtitles": {

              preview: "https://drive.google.com/file/d/1fWyfniNFtsGuZenL7oO7mtQmLMTaZhh9/preview",

              view: "https://drive.google.com/file/d/1fWyfniNFtsGuZenL7oO7mtQmLMTaZhh9/view?usp=sharing",

              title: "Al-Risalah (1976) · Arabic version · 1080p · No subtitles"

            },
          defaultQuality: "1080p · No subtitles",
          qualities: {
            "480p": {'''

          new = '''        arabic: {
          label: "العربية",
          defaultQuality: "1080p · No subtitles",
          qualities: {
            "1080p · No subtitles": {
              preview: "https://drive.google.com/file/d/1fWyfniNFtsGuZenL7oO7mtQmLMTaZhh9/preview",
              view: "https://drive.google.com/file/d/1fWyfniNFtsGuZenL7oO7mtQmLMTaZhh9/view?usp=sharing",
              title: "Al-Risalah (1976) · Arabic version · 1080p · No subtitles"
            },
            "480p": {'''

          if text.count(old) != 1:
              raise SystemExit(f'Expected malformed Arabic source block matched {text.count(old)} times; refusing to patch.')

          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify Media player remains locked and 1080p is selectable
        run: |
          grep -F '.media-player.ios-drive-stage iframe{inset:auto;width:1024px;height:576px;transform-origin:top left;z-index:1}' web-viewer/media/index.html
          grep -F 'const baseWidth = 1024;' web-viewer/media/index.html
          grep -F 'driveFrame.style.transform = `scale(${scale})`;' web-viewer/media/index.html
          grep -F 'defaultQuality: "1080p · No subtitles",' web-viewer/media/index.html
          grep -A6 -F 'qualities: {' web-viewer/media/index.html | grep -F '"1080p · No subtitles": {'

      - name: Commit repaired source data
        run: |
          if git diff --quiet -- web-viewer/media/index.html; then
            echo 'No Media changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-viewer/media/index.html
          git commit -m 'Fix Arabic 1080p source placement'
          git push
