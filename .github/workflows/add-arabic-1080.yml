name: Add Arabic 1080p Media Copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-arabic-1080.yml'

permissions:
  contents: write

jobs:
  patch-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add Arabic 1080p no-subtitles copy without touching player logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('web-viewer/media/index.html')
          text = path.read_text()

          old_heading = '<strong>Arabic version · 480p / 360p</strong>'
          new_heading = '<strong>Arabic version · 1080p / 480p / 360p</strong>'

          old_desc = '<span><span lang="ar" dir="rtl">الرسالة</span> / <em>Al-Risalah</em> · about 3h 27m · Abdallah Gheith, Mona Wassef · Arabic subtitles are visible in the project copies</span>'
          new_desc = '<span><span lang="ar" dir="rtl">الرسالة</span> / <em>Al-Risalah</em> · about 3h 27m · Abdallah Gheith, Mona Wassef · 1080p no-subtitles copy included for Arabic listening study; older project copies remain available</span>'

          old_default = 'defaultQuality: "480p",'
          new_default = 'defaultQuality: "1080p · No subtitles",'

          for needle, label in [
              (old_heading, 'Arabic fact heading'),
              (old_desc, 'Arabic fact description'),
              (old_default, 'Arabic default quality'),
          ]:
              if text.count(needle) != 1:
                  raise SystemExit(f'{label} did not match exactly once; refusing to patch.')

          pattern_480 = re.compile(
              r'(?P<indent>\s*)"480p"\s*:\s*\{\s*'
              r'preview\s*:\s*"https://drive\.google\.com/file/d/1Z9eyOrXjrdKEHjt3_sL_up7rR1V-zzyO/preview",\s*'
              r'view\s*:\s*"https://drive\.google\.com/file/d/1Z9eyOrXjrdKEHjt3_sL_up7rR1V-zzyO/view\?usp=sharing",\s*'
              r'title\s*:\s*"Al-Risalah \(1976\) · Arabic version · 480p"\s*\},'
          )
          matches = list(pattern_480.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'Arabic 480p source block matched {len(matches)} times; refusing to patch.')

          indent = matches[0].group('indent')
          child = indent + '  '
          block_1080 = (
              f'{indent}"1080p · No subtitles": {{\n'
              f'{child}preview: "https://drive.google.com/file/d/1fWyfniNFtsGuZenL7oO7mtQmLMTaZhh9/preview",\n'
              f'{child}view: "https://drive.google.com/file/d/1fWyfniNFtsGuZenL7oO7mtQmLMTaZhh9/view?usp=sharing",\n'
              f'{child}title: "Al-Risalah (1976) · Arabic version · 1080p · No subtitles"\n'
              f'{indent}}},\n'
          )

          text = text.replace(old_heading, new_heading, 1)
          text = text.replace(old_desc, new_desc, 1)
          text = text.replace(old_default, new_default, 1)
          text = text[:matches[0].start()] + block_1080 + text[matches[0].start():]
          path.write_text(text)
          PY

      - name: Verify player implementation remains locked
        run: |
          grep -F '.media-player.ios-drive-stage iframe{inset:auto;width:1024px;height:576px;transform-origin:top left;z-index:1}' web-viewer/media/index.html
          grep -F 'const baseWidth = 1024;' web-viewer/media/index.html
          grep -F 'driveFrame.style.transform = `scale(${scale})`;' web-viewer/media/index.html
          grep -F '1fWyfniNFtsGuZenL7oO7mtQmLMTaZhh9/preview' web-viewer/media/index.html
          grep -F 'defaultQuality: "1080p · No subtitles",' web-viewer/media/index.html

      - name: Commit narrow Media data update
        run: |
          if git diff --quiet -- web-viewer/media/index.html; then
            echo 'No Media changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-viewer/media/index.html
          git commit -m 'Add Arabic 1080p no-subtitles Message copy'
          git push
