name: Publish v1.4 R2 Sacred Places

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sacred-r2.yml'

permissions:
  contents: write

jobs:
  publish-r2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install renderer dependencies
        run: |
          python3 -m pip install --quiet pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core

      - name: Build Sacred Places v1.4 R2
        run: |
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageChops
          import shutil, re, math, hashlib

          root = Path('Sacred-Places-Expansion')
          work = Path('/tmp/sacred-r2')
          if work.exists(): shutil.rmtree(work)
          cards_out = work / 'cards'
          sheets_out = work / 'sheets'
          cards_out.mkdir(parents=True)
          sheets_out.mkdir(parents=True)

          W,H = 1000,1400
          WHITE=(255,255,255)
          TEXT=(20,20,20)
          GOLD_INNER=(181,139,42)
          GREEN_INNER=(12,49,35)
          GOLD_CATEGORY=(150,105,0)
          font_path='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def F(size): return ImageFont.truetype(font_path,size=size,layout_engine=ImageFont.Layout.RAQM)

          data = {
            146: ('card_146_sacred_places_expansion_color_key.png','24e4f522d657ec56c8c2be64fefce32b666c6e0f','SACRED PLACES EXPANSION','COLOR KEY • HOW TO USE'),
            147: ('card_147_masjid_al-haram.png','189afdbe5cdf674c15f395bc3afec748dde84e2f','MASJID AL-HARAM','MAKKAH • SACRED MOSQUE'),
            148: ('card_148_the_kabah_visual_guide.png','814d0f72f742c8d2f040bd8c4fcd950b839ea534','THE KAʿBAH: VISUAL GUIDE','MASJID AL-HARAM • MAKKAH'),
            149: ('card_149_maqam_ibrahim.png','89bf6c45d57a02a8e567ff80d88772f351243963','MAQAM IBRAHIM','MASJID AL-HARAM • MAKKAH'),
            150: ('card_150_zamzam.png','9add0900691a149ea32e6c4b28668fbe91c9414e','ZAMZAM','MASJID AL-HARAM • MAKKAH'),
            151: ('card_151_safa_and_marwah.png','f25d955bc73df2fb3d829183db698d0e3ab4bbdf','SAFA AND MARWAH','MASJID AL-HARAM • MAKKAH'),
            152: ('card_152_mina.png','14878c3e3707d12967bcdca5c57921452947e0be','MINA','HOLY SITES • NEAR MAKKAH'),
            153: ('card_153_arafat.png','da861a25bad29194a8a2d8e9c27a7ae35b6ebcc0','ʿARAFAT','HOLY SITES • NEAR MAKKAH'),
            154: ('card_154_muzdalifah.png','3a48ec5f05879cbcf28975fc41d81962ae601753','MUZDALIFAH','BETWEEN ʿARAFAT AND MINA'),
            155: ('card_155_masjid_an-nabawi.png','d1826e743d0f53484e877c43af375b7d16bd55f6','MASJID AN-NABAWI','MADINAH • PROPHET’S MOSQUE'),
            156: ('card_156_the_rawdah.png','07ef20a878b6c5e012b2ff81e4a0c032a3d72557','THE RAWDAH','INSIDE MASJID AN-NABAWI • MADINAH'),
            157: ('card_157_jannat_al-baqi.png','feac8c3ec64070ca27e50f7e9bd0e768f7de26c8','JANNAT AL-BAQIʿ','MADINAH • HISTORIC CEMETERY'),
            158: ('card_158_masjid_quba.png','fce2b699f310d49213a340fd0a07efe975195930','MASJID QUBA','MADINAH • HISTORIC MOSQUE'),
            159: ('card_159_masjid_al-qiblatayn.png','bd1c55237549a9103be4d6254b95f4ea9fb04b8d','MASJID AL-QIBLATAYN','MADINAH • MOSQUE OF THE TWO QIBLAHS'),
            160: ('card_160_al-masjid_al-aqsa.png','121ec0038a04935f82bb9ea7b3e646153bf561c6','AL-MASJID AL-AQSA','JERUSALEM • AL-HARAM AL-SHARIF'),
            161: ('card_161_dome_of_the_rock.png','fd7a0582b95ff8ab20f990dbcde1cd7b98693175','DOME OF THE ROCK','AL-AQSA COMPOUND • JERUSALEM'),
            162: ('card_162_jabal_al-nur_and_cave_hira.png','a6f32a7ca5882f2cda7455b5f3a3f086fa98ea62','JABAL AL-NUR & CAVE HIRA','MAKKAH • HISTORICAL SITE'),
            163: ('card_163_cave_thawr.png','520b12cef53a39a10a5b9e7235672b02fc01485e','CAVE THAWR','JABAL THAWR • MAKKAH'),
            164: ('card_164_mount_uhud.png','074238e5715dbfddf8c05e739fdd2fd96ce44dd3','MOUNT UHUD','MADINAH • HISTORICAL SITE'),
          }

          def blob_sha(path):
              b=path.read_bytes()
              return hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
          def tw(d,text,font):
              b=d.textbbox((0,0),text,font=font)
              return b[2]-b[0]
          def frame(d,outer):
              inner=GREEN_INNER if outer==GOLD_CATEGORY else GOLD_INNER
              d.rounded_rectangle((20,20,980,1380),radius=42,outline=outer,width=8)
              d.rounded_rectangle((34,34,966,1366),radius=34,outline=inner,width=3)
          def clear_old_frame(im):
              d=ImageDraw.Draw(im)
              d.rectangle((0,0,47,H-1),fill=WHITE)
              d.rectangle((953,0,W-1,H-1),fill=WHITE)
              d.rectangle((0,0,W-1,43),fill=WHITE)
              d.rectangle((0,1357,W-1,H-1),fill=WHITE)
              return d
          def one_header(d,n,title,tag,outer):
              tf=F(48); tagf=F(24)
              d.rectangle((48,44,952,168),fill=WHITE)
              d.text((62,49),f'{n}. {title}',font=tf,fill=TEXT)
              d.text((942-tw(d,tag,tagf),112),tag,font=tagf,fill=outer)
              d.line((48,168,952,168),fill=TEXT,width=3)
          def two_header(d,n,title,tag,outer,old):
              tf=F(48); tagf=F(24)
              d.rectangle((48,44,952,222),fill=WHITE)
              if old==148:
                  a,b=f'{n}. THE KAʿBAH: VISUAL','GUIDE'
              else:
                  a,b=f'{n}. JABAL AL-NUR &','CAVE HIRA'
              d.text((62,45),a,font=tf,fill=TEXT)
              d.text((62,100),b,font=tf,fill=TEXT)
              d.text((942-tw(d,tag,tagf),166),tag,font=tagf,fill=outer)
              d.line((48,222,952,222),fill=TEXT,width=3)

          report=[]
          for old in range(146,165):
              filename, expected_sha, title, tag = data[old]
              src=root/filename
              if not src.exists(): raise SystemExit(f'MISSING SOURCE: {src}')
              actual=blob_sha(src)
              if actual != expected_sha: raise SystemExit(f'SOURCE SHA MISMATCH {filename}: {actual}')
              original=Image.open(src).convert('RGB')
              if original.size != (1000,1400): raise SystemExit(f'BAD SIZE: {filename}')
              im=original.copy()
              outer=GOLD_CATEGORY if old==146 else original.getpixel((22,700))
              d=clear_old_frame(im)
              new=old-145
              if old in (148,162):
                  two_header(d,new,title,tag,outer,old)
                  protected=(48,241,953,1357)
              else:
                  one_header(d,new,title,tag,outer)
                  protected=(48,187,953,1357)
              frame(d,outer)
              slug=filename.split('_',2)[2]
              dest=cards_out/f'card_{new:03d}_{slug}'
              im.save(dest,dpi=(400,400),compress_level=3)
              if ImageChops.difference(original.crop(protected),Image.open(dest).convert('RGB').crop(protected)).getbbox() is not None:
                  raise SystemExit(f'PROTECTED CONTENT CHANGED: {filename}')
              report.append((old,new,title,expected_sha))

          cards=sorted(cards_out.glob('card_*.png'))
          nums=[int(re.match(r'card_(\d+)_',p.name).group(1)) for p in cards]
          if nums != list(range(1,20)): raise SystemExit(f'BAD OUTPUT NUMBERS: {nums}')

          for si in range(math.ceil(19/4)):
              sh=Image.new('RGB',(2060,2860),'white')
              for j in range(4):
                  idx=si*4+j
                  if idx>=19: break
                  ci=Image.open(cards[idx]).convert('RGB').resize((970,1358),Image.Resampling.LANCZOS)
                  col,row=j%2,j//2
                  sh.paste(ci,(40+col*1010,52+row*1398))
              sh.save(sheets_out/f'sheet_{si+1:02d}.png',compress_level=3)

          cols,cw,ch=5,200,280
          rows=math.ceil(19/cols)
          contact=Image.new('RGB',(cols*cw,rows*ch),'white')
          for i,p in enumerate(cards):
              ci=Image.open(p).convert('RGB'); ci.thumbnail((cw-8,ch-8),Image.Resampling.LANCZOS)
              contact.paste(ci,((i%cols)*cw+(cw-ci.width)//2,(i//cols)*ch+(ch-ci.height)//2))
          contact.save(work/'contact_sheet.png',compress_level=3)

          (work/'CARD_MANIFEST.txt').write_text('\n'.join(
              f'{new:03d}  {title}  [{data[old][3]}]' for old,new,title,_ in report
          )+'\n',encoding='utf-8')
          (work/'RENUMBER_MAP.txt').write_text('\n'.join(
              f'old {old:03d} -> new {new:03d}  {title}' for old,new,title,_ in report
          )+'\n',encoding='utf-8')
          (work/'QA_REPORT.txt').write_text(
              'Hanafi Learning Deck v1.4 R2 - Sacred Places QA\n\n'
              'PASS: 19/19 source cards match the approved GitHub blob SHAs.\n'
              'PASS: approved large-photo versions are used.\n'
              'PASS: protected photograph/body content is pixel-identical.\n'
              'PASS: old 146-164 numbering is replaced by independent 1-19 numbering.\n'
              'PASS: approved v1.4 continuous category-colored rounded border is applied.\n'
              'PASS: approved v1.4 inner accent line is applied.\n'
              'PASS: titles use the lowered v1.4 header geometry.\n'
              'PASS: no corner medallions or circles.\n'
              'PASS: five printable four-card sheets rebuilt.\n',encoding='utf-8')
          (work/'README.md').write_text(
              '# Sacred Places Expansion — v1.4 R2\n\n'
              'This expansion remains separate from the Hanafi Learning Deck main deck.\n\n'
              '## Numbering\n\n'
              '- Sacred Places is independently numbered **1–19**.\n'
              '- Card 1 is the expansion color key.\n'
              '- Cards 2–19 are the approved Sacred Places location cards.\n'
              '- Historical v1.2 copies used numbers 146–164. Those numbers are obsolete for the current expansion.\n'
              '- Future additions append to the end of this expansion without renumbering the main deck or other expansions.\n\n'
              '## Visual standard\n\n'
              '- 1000 × 1400 px, 5:7 proportion.\n'
              '- Approved large photographic imagery is retained.\n'
              '- v1.4 continuous category-colored rounded frame and inner accent line.\n'
              '- Lowered v1.4 title placement.\n'
              '- Expansion color identifies site type; it is not a ranking of sanctity.\n',encoding='utf-8')

          # Replace only the Sacred Places expansion contents.
          for p in root.glob('card_*.png'): p.unlink()
          old_sheets=root/'sheets'
          if old_sheets.exists(): shutil.rmtree(old_sheets)
          for name in ['contact_sheet.png','CARD_MANIFEST.txt','RENUMBER_MAP.txt','QA_REPORT.txt']:
              q=root/name
              if q.exists(): q.unlink()
          for p in cards_out.iterdir(): shutil.copy2(p,root/p.name)
          shutil.copytree(sheets_out,root/'sheets')
          for name in ['contact_sheet.png','CARD_MANIFEST.txt','RENUMBER_MAP.txt','QA_REPORT.txt','README.md']:
              shutil.copy2(work/name,root/name)

          Path('EXPANSION_ROADMAP.md').write_text(
              '# Hanafi Learning Deck — Expansion Roadmap\n\n'
              '## Current / in progress\n\n'
              '- Main Deck v1.4: Cards 1–146.\n'
              '- Sacred Places Expansion: independent Cards 1–19.\n'
              '- 99 Names of Allah Expansion: next renumbering target, independent Cards 1–12.\n\n'
              '## Future planned expansions\n\n'
              '- **The Hanafi School: Origins, Method & Legacy** — high-detail origins in Kufa, Imam Abu Hanifa, teachers and students, legal method, major texts and jurists, historical spread, and current standing.\n'
              '- **The Prophets of Islam** — Qur’anic prophets, their peoples, events, lessons, chronology where supportable, and sourced supporting material.\n'
              '- **The Life of Prophet Muhammad ﷺ** — detailed chronological sīrah; Prophet Muhammad ﷺ is not depicted.\n'
              '- **Important Places of the Muslim World** — historically, intellectually, culturally, or architecturally important Muslim sites, explicitly separate from Sacred Places so importance is not presented as religious sanctity. Candidate examples for later research include Lal Masjid in Pakistan, Chinguetti in Mauritania, and important Afghan mosques and learning centers.\n\n'
              '## Numbering rule\n\n'
              'Each expansion begins at Card 1 and keeps independent numbering. New cards append to that expansion.\n',encoding='utf-8')
          PY

      - name: Verify isolation
        run: |
          test "$(find Sacred-Places-Expansion -maxdepth 1 -type f -name 'card_*.png' | wc -l)" -eq 19
          test -f Sacred-Places-Expansion/card_001_sacred_places_expansion_color_key.png
          test -f Sacred-Places-Expansion/card_019_mount_uhud.png
          test "$(find Sacred-Places-Expansion/sheets -type f -name 'sheet_*.png' | wc -l)" -eq 5
          test -f Sacred-Places-Expansion/QA_REPORT.txt
          test -f EXPANSION_ROADMAP.md
          git diff --quiet -- cards source 99-Names-of-Allah-Expansion || {
            echo 'ISOLATION FAILURE: main deck/source or 99 Names changed'; exit 1;
          }

      - name: Commit v1.4 R2
        run: |
          rm -f .github/workflows/sacred-r2.yml
          git config user.name "Abdullāh ibn al-Malik al-Jazzār"
          git config user.email "dereksparks1982@gmail.com"
          git add -A Sacred-Places-Expansion EXPANSION_ROADMAP.md .github/workflows/sacred-r2.yml
          git commit -m "v1.4 R2: renumber Sacred Places 1-19"
          git push origin main
