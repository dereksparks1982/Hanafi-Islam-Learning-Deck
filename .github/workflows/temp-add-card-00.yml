name: TEMP Add Card 00

on:
  push:
    paths:
      - '.github/workflows/temp-add-card-00.yml'

permissions:
  contents: write

jobs:
  add-card-00:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Download approved Card 00 exactly
        env:
          CARD_URL: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-f530-822f-a692-74603c36bf29/raw?se=2026-09-20T20%3A41%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=a4a51af6-37a1-5140-be18-e6574a4e5b6b&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T16%3A57%3A01Z&ske=2026-09-21T16%3A57%3A01Z&sks=b&skv=2026-02-06&sig=jbYoYS/yQ8u%2BG2GrmH1uu7SqKnw3x3maHqO7bs7qSIc%3D'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$CARD_URL" -o /tmp/card_000.png
          test "$(stat -c%s /tmp/card_000.png)" = "3535590"
          echo "6e4f9965413a53912553a49fda1f09a3fa49691a1a6760e7759fe2072c55ec88  /tmp/card_000.png" | sha256sum -c -
          cp /tmp/card_000.png cards/card_000.png

      - name: Rebuild main-deck sheets and indexes
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import math

          cards_dir = Path('cards')
          sheets_dir = Path('sheets')
          card_paths = sorted(cards_dir.glob('card_*.png'))
          if len(card_paths) != 147:
              raise SystemExit(f'Expected 147 main-deck cards including Card 00, found {len(card_paths)}')
          if card_paths[0].name != 'card_000.png' or card_paths[-1].name != 'card_146.png':
              raise SystemExit('Main-deck card ordering is not card_000 through card_146')

          # Printable sheets: preserve every source card. Existing 1000x1400 cards
          # fill the slot exactly; Card 00 is scaled proportionally and centered.
          sheet_w, sheet_h = 2060, 2860
          slot_w, slot_h = 970, 1358
          gap_x, gap_y = 40, 40
          start_x, start_y = 40, 52
          sheets_dir.mkdir(exist_ok=True)
          for old in sheets_dir.glob('sheet_*.png'):
              old.unlink()

          for si in range(math.ceil(len(card_paths) / 4)):
              sheet = Image.new('RGB', (sheet_w, sheet_h), 'white')
              for j in range(4):
                  idx = si * 4 + j
                  if idx >= len(card_paths):
                      break
                  with Image.open(card_paths[idx]) as src:
                      im = src.convert('RGB')
                      scale = min(slot_w / im.width, slot_h / im.height)
                      nw = max(1, round(im.width * scale))
                      nh = max(1, round(im.height * scale))
                      im = im.resize((nw, nh), Image.Resampling.LANCZOS)
                  col, row = j % 2, j // 2
                  slot_x = start_x + col * (slot_w + gap_x)
                  slot_y = start_y + row * (slot_h + gap_y)
                  x = slot_x + (slot_w - nw) // 2
                  y = slot_y + (slot_h - nh) // 2
                  sheet.paste(im, (x, y))
              sheet.save(sheets_dir / f'sheet_{si + 1:02d}.png', optimize=True)

          # Contact sheet, now beginning with Card 00.
          cols, cw, ch = 8, 180, 252
          rows = math.ceil(len(card_paths) / cols)
          contact = Image.new('RGB', (cols * cw, rows * ch), 'white')
          for i, p in enumerate(card_paths):
              with Image.open(p) as src:
                  im = src.convert('RGB')
                  im.thumbnail((cw - 6, ch - 6), Image.Resampling.LANCZOS)
              x = (i % cols) * cw + (cw - im.width) // 2
              y = (i // cols) * ch + (ch - im.height) // 2
              contact.paste(im, (x, y))
          contact.save('contact_sheet.png', optimize=True)

          # Manifest: Card 00 exists as deck metadata only. Nothing is printed on the artwork.
          manifest = Path('CARD_MANIFEST.txt')
          text = manifest.read_text(encoding='utf-8')
          if '000  THE BEAUTIFUL NAMES OF ALLAH' not in text:
              text = text.replace(
                  '\n\n001  ALLAH  [FOUNDATION]',
                  '\n\n000  THE BEAUTIFUL NAMES OF ALLAH  [FOUNDATION]\n001  ALLAH  [FOUNDATION]',
                  1,
              )
          manifest.write_text(text, encoding='utf-8')

          # Mobile view: Card 00 appears before Card 001.
          mobile = Path('mobile-view/Main-Deck.md')
          text = mobile.read_text(encoding='utf-8')
          text = text.replace('146 cards. This is a viewing page only;', '147 cards. This is a viewing page only;', 1)
          block = '''## Card 00\n\n<p align="center"><a href="https://raw.githubusercontent.com/dereksparks1982/Hanafi-Islam-Learning-Deck/main/cards/card_000.png"><img src="../cards/card_000.png" width="88%" alt="card 00"></a></p>\n\n<p align="center"><a href="https://raw.githubusercontent.com/dereksparks1982/Hanafi-Islam-Learning-Deck/main/cards/card_000.png">Open full-size card / pinch to zoom</a></p>\n\n<br><br><br><br>\n\n---\n\n'''
          if '## Card 00\n' not in text:
              text = text.replace('## Card 001\n', block + '## Card 001\n', 1)
          mobile.write_text(text, encoding='utf-8')

          mobile_index = Path('mobile-view/README.md')
          if mobile_index.exists():
              text = mobile_index.read_text(encoding='utf-8')
              text = text.replace('146 cards', '147 cards')
              mobile_index.write_text(text, encoding='utf-8')

          # Keep the existing checkpoint/version number. Only counts and range change.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          replacements = {
              '207 numbered cards across five independent sets': '208 numbered cards across five independent sets',
              '| Main Deck | established | 146 |': '| Main Deck | established | 147 |',
              '**Main Deck, Cards 1–146:**': '**Main Deck, Cards 00–146:**',
              '### Main Deck — Cards 1–146': '### Main Deck — Cards 00–146',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          readme.write_text(text, encoding='utf-8')

          print(f'PASS: {len(card_paths)} cards, {math.ceil(len(card_paths)/4)} printable sheets')
          PY

      - name: Verify Card 00 remained byte-for-byte exact
        run: |
          set -euo pipefail
          test "$(stat -c%s cards/card_000.png)" = "3535590"
          echo "6e4f9965413a53912553a49fda1f09a3fa49691a1a6760e7759fe2072c55ec88  cards/card_000.png" | sha256sum -c -
          python - <<'PY'
          from PIL import Image
          im = Image.open('cards/card_000.png')
          assert im.size == (1024, 1536), im.size
          print('PASS: Card 00 dimensions 1024x1536')
          PY

      - name: Commit Card 00 and derived main-deck files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards/card_000.png sheets contact_sheet.png CARD_MANIFEST.txt mobile-view/Main-Deck.md mobile-view/README.md README.md
          git commit -m 'Add Card 00 to beginning of main deck'
          git push origin main
