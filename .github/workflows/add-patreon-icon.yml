name: Add approved Patreon icon

on:
  push:
    paths:
      - '.github/workflows/add-patreon-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-approved-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download exact approved JPEG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web-viewer/assets
          curl -L --fail --retry 3 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-55f0-81f7-a8a2-6c6153dcbb20/raw?se=2026-09-23T23%3A10%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=f57178ec-9791-56b9-9bfd-64f893d530ea&skoid=c36a4874-d531-4a8d-99fc-7da0d9143d9c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T22%3A03%3A30Z&ske=2026-09-24T22%3A03%3A30Z&sks=b&skv=2026-02-06&sig=A674g0aqHURFxUPjJxUkpaoe%2BZH0qq7lFTfh5cJ/RpI%3D' -o web-viewer/assets/patreon-icon.jpeg
          test "$(stat -c%s web-viewer/assets/patreon-icon.jpeg)" = '20361'
          echo '66accd52eba6d49a30d73ae86c89584bafe198452423edfa39a02b3291697aa4  web-viewer/assets/patreon-icon.jpeg' | sha256sum -c -

      - name: Commit only approved icon
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Abdullāh ibn al-Malik al-Jazzār'
          git config user.email 'dereksparks1982@gmail.com'
          git add web-viewer/assets/patreon-icon.jpeg
          git diff --cached --quiet && exit 0
          git commit -m 'Add approved Patreon icon'
          git push origin HEAD:main
