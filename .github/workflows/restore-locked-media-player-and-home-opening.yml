name: Restore locked Media player and Home opening

on:
  push:
    paths:
      - .github/workflows/restore-locked-media-player-and-home-opening.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact approved changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {n}')
              return text.replace(old, new, 1)

          # Restore the exact previously accepted iPhone Drive-player behavior.
          p = Path('web-viewer/media/index.html')
          s = p.read_text(encoding='utf-8')

          s = replace_once(s,
          '''    /* iPhone/iPad: keep the normal responsive Drive iframe; only the wrapper expands for full screen. */
              .media-player.ios-drive-fullscreen{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;aspect-ratio:auto;border-radius:0;z-index:2147483000;background:#000}
          ''',
          '''    /* iPhone/iPad: give the Google player a desktop-sized internal viewport, then scale it down. */
              .media-player.ios-drive-stage iframe{inset:auto;width:1024px;height:576px;transform-origin:top left;z-index:1}
              .media-player.ios-drive-fullscreen{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;aspect-ratio:auto;border-radius:0;z-index:2147483000;background:#000}
          ''', 'Media CSS')

          s = replace_once(s,
          '''        videoTab.setAttribute("aria-selected", String(showVideo));
                  audioTab.setAttribute("aria-selected", String(!showVideo));
                }
          ''',
          '''        videoTab.setAttribute("aria-selected", String(showVideo));
                  audioTab.setAttribute("aria-selected", String(!showVideo));
                  if (showVideo && isIOS) window.setTimeout(sizeIOSDriveFrame, 0);
                }
          ''', 'Media tab resize')

          s = replace_once(s,
          '''        fallback.href = selected.view;
                  mediaStatus.textContent = `${version.label} · ${selectedQuality} selected.`;
                }
          ''',
          '''        fallback.href = selected.view;
                  mediaStatus.textContent = `${version.label} · ${selectedQuality} selected.`;
                  if (isIOS) window.setTimeout(sizeIOSDriveFrame, 0);
                }
          ''', 'Media selection resize')

          s = replace_once(s,
          '''      function setIOSFullscreen(active) {
                  if (!isIOS) return;
                  iosFullscreen = active;
                  mediaPlayer.classList.toggle("ios-drive-fullscreen", active);
                  document.body.classList.toggle("ios-media-fullscreen", active);
                  exitFullscreenButton.hidden = !active;
                  fullscreenButton.textContent = active ? "Exit full screen" : "Full screen";
                }
          ''',
          '''      function sizeIOSDriveFrame() {
                  if (!isIOS) return;
                  const baseWidth = 1024;
                  const baseHeight = 576;
                  const width = iosFullscreen ? window.innerWidth : mediaPlayer.clientWidth;
                  const height = iosFullscreen ? window.innerHeight : mediaPlayer.clientHeight;
                  const scale = iosFullscreen ? Math.min(width / baseWidth, height / baseHeight) : width / baseWidth;
                  const left = Math.max(0, (width - baseWidth * scale) / 2);
                  const top = Math.max(0, (height - baseHeight * scale) / 2);

                  driveFrame.style.width = `${baseWidth}px`;
                  driveFrame.style.height = `${baseHeight}px`;
                  driveFrame.style.left = `${left}px`;
                  driveFrame.style.top = `${top}px`;
                  driveFrame.style.transform = `scale(${scale})`;
                }

                function setIOSFullscreen(active) {
                  if (!isIOS) return;
                  iosFullscreen = active;
                  mediaPlayer.classList.toggle("ios-drive-fullscreen", active);
                  document.body.classList.toggle("ios-media-fullscreen", active);
                  exitFullscreenButton.hidden = !active;
                  fullscreenButton.textContent = active ? "Exit full screen" : "Full screen";
                  window.setTimeout(sizeIOSDriveFrame, 0);
                }
          ''', 'Media sizing function')

          s = replace_once(s,
          '''      if (isIOS) {
                  fullscreenButton.hidden = false;
                  mediaNote.innerHTML = "On iPhone and iPad, the Google Drive player uses the same responsive player as desktop. <strong>Full screen</strong> expands that player to the whole browser viewport, and the fixed <strong>Exit full screen</strong> button returns to the page. The separate Google Drive link remains the fallback if streaming has trouble.";
                }
          ''',
          '''      if (isIOS) {
                  mediaPlayer.classList.add("ios-drive-stage");
                  fullscreenButton.hidden = false;
                  mediaNote.innerHTML = "On iPhone and iPad, the Google Drive player is rendered in a desktop-sized frame and scaled to fit so its controls remain reachable. <strong>Full screen</strong> expands the player to the whole browser viewport, and the fixed <strong>Exit full screen</strong> button returns to the page. The separate Google Drive link remains the fallback if streaming has trouble.";
                  window.addEventListener("resize", sizeIOSDriveFrame);
                  window.addEventListener("orientationchange", () => window.setTimeout(sizeIOSDriveFrame, 150));
                  window.setTimeout(sizeIOSDriveFrame, 0);
                }
          ''', 'Media iOS init')

          if '<span class="media-release">v2.1</span>' not in s:
              raise SystemExit('Media v2.1 marker missing')
          if '<h3>Sources and further information</h3>' in s:
              raise SystemExit('Message sources block unexpectedly present')
          p.write_text(s, encoding='utf-8')

          # Add the devotional opening to Home. Existing v2.1 stays untouched at far right.
          p = Path('web-viewer/index.html')
          s = p.read_text(encoding='utf-8')

          s = replace_once(s,
          '''    #setNav.card-layout-pending,
              #library.card-layout-pending { visibility: hidden; }
          ''',
          '''    #setNav.card-layout-pending,
              #library.card-layout-pending { visibility: hidden; }

              .home-devotion {
                width: min(860px, 100%);
                margin: 1.15rem auto 1.35rem;
                padding: 1rem 1.15rem;
                text-align: center;
                border-top: 1px solid rgba(216,181,96,.32);
                border-bottom: 1px solid rgba(216,181,96,.32);
              }
              .home-devotion h2 { margin: 0 0 .55rem; color: #f3d989; font-size: clamp(1.55rem, 4vw, 2.2rem); line-height: 1.5; }
              .home-devotion p { margin: .4rem 0; line-height: 1.65; }
              .home-devotion-arabic { margin-top: .85rem !important; color: #f7f1df; font-size: clamp(1.1rem, 3vw, 1.45rem); line-height: 1.8 !important; }
              .home-devotion-intention { margin-top: .9rem !important; }
          ''', 'Home devotional style')

          opening = '''      <h1 class="home-brand-title">Hanafi Learning Deck</h1>
              <section class="home-devotion" aria-labelledby="homeBismillah">
                <h2 id="homeBismillah" lang="ar" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</h2>
                <p><strong>Bismillāhir-Raḥmānir-Raḥīm</strong></p>
                <p><em>In the name of Allah, the Most Compassionate, the Most Merciful.</em></p>
                <p class="home-devotion-arabic" lang="ar" dir="rtl"><strong>الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ، وَالصَّلَاةُ وَالسَّلَامُ عَلَىٰ رَسُولِ اللَّهِ</strong></p>
                <p><strong>Al-ḥamdu lillāhi Rabbil-ʿālamīn, waṣ-ṣalātu was-salāmu ʿalā Rasūlillāh.</strong></p>
                <p><em>All praise belongs to Allah, Lord of the worlds, and peace and blessings be upon the Messenger of Allah ﷺ.</em></p>
                <p class="home-devotion-intention">This project is undertaken seeking the pleasure of Allah and the spread of beneficial knowledge. May Allah accept what is correct and beneficial in it, forgive its errors, and guide its continued correction and improvement. <strong>Āmīn.</strong></p>
              </section>'''
          s = replace_once(s, '      <h1 class="home-brand-title">Hanafi Learning Deck</h1>', opening, 'Home title')

          if s.count('<span class="home-version">v2.1</span>') != 1:
              raise SystemExit('Home v2.1 marker moved, missing, or duplicated')
          if 'Hanafi Learning Deck v2.0' in s or '[svg]' in s:
              raise SystemExit('Copy/paste artifact detected')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify exact scope
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'web-viewer/index.html\nweb-viewer/media/index.html'

      - name: Commit approved build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-viewer/index.html web-viewer/media/index.html
          git commit -m "Lock known-good Media player and add Home invocation"
          git push origin HEAD:main
