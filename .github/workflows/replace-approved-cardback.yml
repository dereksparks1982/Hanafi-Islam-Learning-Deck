name: Replace approved card back

on:
  push:
    paths:
      - '.github/workflows/replace-approved-cardback.yml'

permissions:
  contents: write

jobs:
  replace-card-back:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify approved card back
        env:
          CARD_URL: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-89d8-822f-9409-8b03b6238217/raw?se=2026-09-19T15%3A09%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=8083dcab-2ff1-5f68-859d-60158ccddc74&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T19%3A13%3A07Z&ske=2026-09-19T19%3A13%3A07Z&sks=b&skv=2026-02-06&sig=%2BUiDok8yYa0p8lApPTCEGQAXMqrx2iRC%2BVx4yvI8UOY%3D'
          EXPECTED_SHA256: '30a971c95499f9d2d1a0336fe15cc4588cf608239d049f4771e1c9a74f166a63'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 "$CARD_URL" -o /tmp/CardBack.png
          test "$(stat -c%s /tmp/CardBack.png)" = "1258309"
          echo "$EXPECTED_SHA256  /tmp/CardBack.png" | sha256sum -c -

      - name: Replace card back
        run: |
          set -euo pipefail
          mkdir -p card-back
          cp /tmp/CardBack.png card-back/CardBack.png
          echo '30a971c95499f9d2d1a0336fe15cc4588cf608239d049f4771e1c9a74f166a63  card-back/CardBack.png' | sha256sum -c -

      - name: Commit approved card back
        run: |
          set -euo pipefail
          git config user.name 'Abdullāh ibn al-Malik al-Jazzār'
          git config user.email 'dereksparks1982@gmail.com'
          git add card-back/CardBack.png
          if git diff --cached --quiet; then
            echo 'Card back already matches approved image.'
          else
            git commit -m 'Replace card back with approved print-friendly design'
            git push origin HEAD:main
          fi

      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm .github/workflows/replace-approved-cardback.yml
          git commit -m 'Remove one-time approved card back replacement workflow'
          git push origin HEAD:main
