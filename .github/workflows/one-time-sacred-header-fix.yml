name: One-time Sacred Places header repair

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-sacred-header-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-noto-core libraqm0
          python -m pip install --quiet pillow numpy

      - name: Repair only the seven Sacred Places headers and add learning links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import json, math, re
          import numpy as np

          ROOT = Path('.')
          LABELS = json.loads((ROOT/'source/title_language_labels.json').read_text(encoding='utf-8'))
          FONT_B = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          FONT_I = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Oblique.ttf'
          FONT_AR = '/usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf'
          DARK_GREEN = (8,55,38)
          BLACK = (12,12,12)
          COLORS={'black':(20,20,20),'red':(178,0,0),'green':(0,105,55),'gold':(150,105,0),'blue':(0,80,165),'purple':(105,45,145),'orange':(190,85,0),'teal':(0,105,115),'maroon':(125,25,55)}
          SACRED_TAGS={1:('COLOR KEY • HOW TO USE','gold'),2:('MAKKAH • SACRED MOSQUE','gold'),3:('MASJID AL-HARAM • MAKKAH','gold'),4:('MASJID AL-HARAM • MAKKAH','gold'),5:('MASJID AL-HARAM • MAKKAH','gold'),6:('MASJID AL-HARAM • MAKKAH','gold'),7:('HOLY SITES • NEAR MAKKAH','blue'),8:('HOLY SITES • NEAR MAKKAH','blue'),9:("BETWEEN 'ARAFAT AND MINA",'blue'),10:("MADINAH • PROPHET'S MOSQUE",'green'),11:('INSIDE MASJID AN-NABAWI • MADINAH','green'),12:('MADINAH • HISTORIC CEMETERY','green'),13:('MADINAH • HISTORIC MOSQUE','green'),14:('MADINAH • MOSQUE OF THE TWO QIBLAHS','green'),15:('JERUSALEM • AL-HARAM AL-SHARIF','gold'),16:('AL-AQSA COMPOUND • JERUSALEM','gold'),17:('MAKKAH • HISTORICAL SITE','teal'),18:('JABAL THAWR • MAKKAH','teal'),19:('MADINAH • HISTORICAL SITE','maroon')}
          AFFECTED = {
              1: 'card_001_sacred_places_expansion_color_key.png',
              2: 'card_002_masjid_al-haram.png',
              4: 'card_004_maqam_ibrahim.png',
              6: 'card_006_safa_and_marwah.png',
              10: 'card_010_masjid_an-nabawi.png',
              14: 'card_014_masjid_al-qiblatayn.png',
              16: 'card_016_dome_of_the_rock.png',
          }

          def F(path,size):
              return ImageFont.truetype(path,size=size,layout_engine=ImageFont.Layout.RAQM)
          def width(d,t,f,direction=None):
              b=d.textbbox((0,0),t,font=f,direction=direction); return b[2]-b[0]
          def wrap(d,text,f,maxw):
              words=text.split(); lines=[]; cur=''
              for w in words:
                  cand=w if not cur else cur+' '+w
                  if width(d,cand,f)<=maxw: cur=cand
                  else:
                      if cur: lines.append(cur)
                      cur=w
              if cur: lines.append(cur)
              return lines
          def fit_single(d,text,fontpath,start,minsize,maxw,direction=None):
              for s in range(start,minsize-1,-1):
                  f=F(fontpath,s)
                  if width(d,text,f,direction)<=maxw:return f
              return F(fontpath,minsize)
          def fit_title_reserved(d,text,top,max_bottom,maxw):
              for s in range(46,21,-1):
                  f=F(FONT_B,s); lines=wrap(d,text,f,maxw)
                  if not lines or len(lines)>2: continue
                  y=top; bottom=top
                  for line in lines:
                      b=d.textbbox((63,y),line,font=f)
                      bottom=max(bottom,b[3]); y += s+2
                  if bottom <= max_bottom:
                      return f,lines
              raise RuntimeError(f'Could not fit title without collision: {text}')
          def detect_dark_divider(im,y0=120,y1=240):
              arr=np.array(im.convert('RGB')); region=arr[y0:y1,40:-40]
              dark=(region[:,:,0]<220)&(region[:,:,1]<220)&(region[:,:,2]<220)
              counts=dark.sum(axis=1); y=int(y0+np.argmax(counts))
              if counts.max()<400: raise RuntimeError(f'No divider found {counts.max()}')
              return y
          def avg_bg(im,box):
              arr=np.array(im.convert('RGB').crop(box)); return tuple(np.median(arr.reshape(-1,3),axis=0).astype(int))

          sacred_dir=ROOT/'Sacred-Places-Expansion'
          for n,name in AFFECTED.items():
              p=sacred_dir/name
              before=Image.open(p).convert('RGB'); im=before.copy(); d=ImageDraw.Draw(im)
              div=detect_dark_divider(im)
              bg=avg_bg(im,(400,45,600,min(div-10,130)))
              d.rectangle((47,40,953,div-4),fill=bg)
              lab=LABELS['sacred_places'][str(n)]
              latin_y=div-37
              ef,elines=fit_title_reserved(d,f"{n}. {lab['english']}",48,latin_y-10,570)
              y=48
              for line in elines:
                  d.text((63,y),line,font=ef,fill=BLACK); y += ef.size+2
              af=fit_single(d,lab['arabic'],FONT_AR,42,24,300,'rtl')
              d.text((940,46),lab['arabic'],font=af,fill=DARK_GREEN,anchor='ra',direction='rtl')
              lf=fit_single(d,lab['latin'],FONT_I,20,13,430)
              d.text((63,latin_y),lab['latin'],font=lf,fill=DARK_GREEN)
              tag,col=SACRED_TAGS[n]
              tf=fit_single(d,tag,FONT_B,16,11,350)
              d.text((940,latin_y),tag,font=tf,fill=COLORS[col],anchor='ra')
              d.line((48,div,952,div),fill=BLACK,width=3)
              a=np.array(before); b=np.array(im)
              if np.any(a[div+2:] != b[div+2:]):
                  raise RuntimeError(f'Body changed below header on Sacred Places Card {n}')
              im.save(p,'PNG',optimize=True)
              print(f'PASS card {n}: divider={div}, title_font={ef.size}, latin_font={lf.size}')

          # Rebuild only printable sheets that contain affected cards: sheets 1-4. Sheet 5 stays untouched.
          cards=[]
          for p in sacred_dir.glob('card_*.png'):
              m=re.match(r'card_(\d+)_',p.name)
              if m: cards.append((int(m.group(1)),p))
          cards=[p for _,p in sorted(cards)]
          sheets_dir=sacred_dir/'sheets'
          for i in range(4):
              sheet=Image.new('RGB',(2060,2860),'white')
              for j in range(4):
                  idx=i*4+j
                  if idx>=len(cards): break
                  c=Image.open(cards[idx]).convert('RGB').resize((970,1358),Image.Resampling.LANCZOS)
                  col,row=j%2,j//2
                  sheet.paste(c,(40+col*(970+40),52+row*(1358+40)))
              sheet.save(sheets_dir/f'sheet_{i+1:02d}.png','PNG',optimize=True)

          # Rebuild Sacred Places contact sheet so it reflects the repaired cards.
          cols,cellw,cellh=5,200,280
          rows=math.ceil(len(cards)/cols)
          out=Image.new('RGB',(cols*cellw,rows*cellh),'white')
          for i,p in enumerate(cards):
              im=Image.open(p).convert('RGB'); im.thumbnail((cellw-8,cellh-8),Image.Resampling.LANCZOS)
              x=(i%cols)*cellw+(cellw-im.width)//2; y=(i//cols)*cellh+(cellh-im.height)//2
              out.paste(im,(x,y))
          out.save(sacred_dir/'contact_sheet.png','PNG',optimize=True)

          # Future-proof the renderer so a later v1.6.2 rebuild does not recreate this collision.
          tool=ROOT/'tools/apply_title_triples.py'
          text=tool.read_text(encoding='utf-8')
          old=re.search(r"def apply_sacred\(\):\n.*?    return changed\n\n(?=def names_files\(\):)",text,re.S)
          if not old:
              raise RuntimeError('apply_sacred block not found')
          new='''def apply_sacred(only=None):\n    changed=[]\n    wanted=None if only is None else set(only)\n    for n,p in sacred_files():\n        if wanted is not None and n not in wanted: continue\n        before=Image.open(p).convert('RGB'); im=before.copy(); d=ImageDraw.Draw(im); div=detect_dark_divider(im,120,240)\n        bg=avg_bg(im,(400,45,600,min(div-10,130))); d.rectangle((47,40,953,div-4),fill=bg)\n        lab=LABELS['sacred_places'][str(n)]; eng=f"{n}. {lab['english']}"; latin_y=div-37\n        ef=elines=None\n        for s in range(46,21,-1):\n            cand=F(FONT_B,s); lines=wrap(d,eng,cand,570)\n            if not lines or len(lines)>2: continue\n            y=48; bottom=48\n            for line in lines:\n                b=d.textbbox((63,y),line,font=cand); bottom=max(bottom,b[3]); y += s+2\n            if bottom <= latin_y-10:\n                ef,elines=cand,lines; break\n        if ef is None: raise RuntimeError(f'Could not fit Sacred Places title {n}')\n        y=48\n        for line in elines:\n            d.text((63,y),line,font=ef,fill=BLACK); y += ef.size+2\n        af=fit_single(d,lab['arabic'],FONT_AR,42,24,300,'rtl'); d.text((940,46),lab['arabic'],font=af,fill=DARK_GREEN,anchor='ra',direction='rtl')\n        lf=fit_single(d,lab['latin'],FONT_I,20,13,430); d.text((63,latin_y),lab['latin'],font=lf,fill=DARK_GREEN)\n        tag,col=SACRED_TAGS[n]; tf=fit_single(d,tag,FONT_B,16,11,350); d.text((940,latin_y),tag,font=tf,fill=COLORS[col],anchor='ra')\n        d.line((48,div,952,div),fill=BLACK,width=3)\n        preserve_below(before,im,div+2,f'sacred {n}'); im.save(p,'PNG',optimize=True); changed.append(p)\n    return changed\n\n'''
          text=text[:old.start()]+new+text[old.end():]
          tool.write_text(text,encoding='utf-8')

          # Create a dedicated README learning-links section. The Hanafi playlist title is the creator/YouTube playlist title.
          readme=ROOT/'README.md'
          r=readme.read_text(encoding='utf-8')
          r=r.replace('- **Arabic alphabet pronunciation video — Language Simp:** https://www.youtube.com/watch?v=TLnr17rEFrQ&t=164s\n','')
          section='''\n## Recommended learning links\n\nThese external resources complement the deck and remain on their original creators' channels:\n\n- **Hanafi salah / prayer tutorial playlist — Man prayer (Hanafi):** https://www.youtube.com/playlist?list=PLgfsDRXXIm95Ef1zHj3ui3iqSJHhTwrdc\n- **Arabic Alphabet Explained by an American — Language Simp:** https://www.youtube.com/watch?v=TLnr17rEFrQ&t=164s\n- **Arabic learning video — Language Simp (starts at 5:37):** https://www.youtube.com/watch?v=xBG1eVwH_wg&t=337s\n\n'''
          marker='\n## The five current sets\n'
          if '## Recommended learning links' not in r:
              if marker not in r: raise RuntimeError('README insertion marker missing')
              r=r.replace(marker,section+marker,1)
          readme.write_text(r,encoding='utf-8')
          PY

      - name: Verify exact repair scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected.txt <<'EOF'
          README.md
          Sacred-Places-Expansion/card_001_sacred_places_expansion_color_key.png
          Sacred-Places-Expansion/card_002_masjid_al-haram.png
          Sacred-Places-Expansion/card_004_maqam_ibrahim.png
          Sacred-Places-Expansion/card_006_safa_and_marwah.png
          Sacred-Places-Expansion/card_010_masjid_an-nabawi.png
          Sacred-Places-Expansion/card_014_masjid_al-qiblatayn.png
          Sacred-Places-Expansion/card_016_dome_of_the_rock.png
          Sacred-Places-Expansion/contact_sheet.png
          Sacred-Places-Expansion/sheets/sheet_01.png
          Sacred-Places-Expansion/sheets/sheet_02.png
          Sacred-Places-Expansion/sheets/sheet_03.png
          Sacred-Places-Expansion/sheets/sheet_04.png
          tools/apply_title_triples.py
          EOF
          git diff --name-only | sort > /tmp/actual.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --quiet -- Sacred-Places-Expansion/sheets/sheet_05.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          nums={1:'card_001_sacred_places_expansion_color_key.png',2:'card_002_masjid_al-haram.png',4:'card_004_maqam_ibrahim.png',6:'card_006_safa_and_marwah.png',10:'card_010_masjid_an-nabawi.png',14:'card_014_masjid_al-qiblatayn.png',16:'card_016_dome_of_the_rock.png'}
          for n,name in nums.items():
              p=Path('Sacred-Places-Expansion')/name
              im=Image.open(p)
              if im.size != (1000,1400): raise SystemExit(f'Bad size on card {n}: {im.size}')
          print('PASS: seven affected cards remain 1000x1400; sheet 5 untouched; scope exact')
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md tools/apply_title_triples.py \
            Sacred-Places-Expansion/card_001_sacred_places_expansion_color_key.png \
            Sacred-Places-Expansion/card_002_masjid_al-haram.png \
            Sacred-Places-Expansion/card_004_maqam_ibrahim.png \
            Sacred-Places-Expansion/card_006_safa_and_marwah.png \
            Sacred-Places-Expansion/card_010_masjid_an-nabawi.png \
            Sacred-Places-Expansion/card_014_masjid_al-qiblatayn.png \
            Sacred-Places-Expansion/card_016_dome_of_the_rock.png \
            Sacred-Places-Expansion/contact_sheet.png \
            Sacred-Places-Expansion/sheets/sheet_01.png \
            Sacred-Places-Expansion/sheets/sheet_02.png \
            Sacred-Places-Expansion/sheets/sheet_03.png \
            Sacred-Places-Expansion/sheets/sheet_04.png
          git commit -m 'Fix Sacred Places title spacing and add learning links'
          git push
