name: Label private movie pages as Private Media

on:
  push:
    paths:
      - '.github/workflows/private-media-label-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Private Media label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web-viewer/media/movie.html')
          s = p.read_text(encoding='utf-8')
          old = 'const mediaBack=document.getElementById("mediaBack");\nif(privateMedia){\n  mediaBack.textContent="← Private Library";'
          new = 'const mediaBack=document.getElementById("mediaBack");\nconst mediaEyebrow=document.querySelector(".app-header .eyebrow");\nif(privateMedia){\n  if(mediaEyebrow)mediaEyebrow.textContent="Hanafi Learning Deck · Private Media";\n  mediaBack.textContent="← Private Library";'
          if old not in s:
              raise SystemExit('Expected private movie header block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify exact change
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'mediaEyebrow.textContent="Hanafi Learning Deck · Private Media"' web-viewer/media/movie.html
          grep -F 'mediaBack.textContent="← Private Library"' web-viewer/media/movie.html
          git diff --check

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/private-media-label-once.yml
          git config user.name 'Derek Sparks'
          git config user.email 'dereksparks1982@users.noreply.github.com'
          git add web-viewer/media/movie.html .github/workflows/private-media-label-once.yml
          git commit -m 'Label private movie pages as Private Media'
          git push origin HEAD:main
