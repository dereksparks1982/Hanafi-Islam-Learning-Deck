name: Upload approved Hanafi icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-approved-icon.yml'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify approved icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web-viewer/assets
          curl -fL 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-a204-8211-b189-37483853d4d6/raw?se=2026-09-23T13%3A56%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=4cf8ba94-2c01-56e1-8f59-a7263d54bf53&skoid=c36a4874-d531-4a8d-99fc-7da0d9143d9c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T23%3A04%3A26Z&ske=2026-09-23T23%3A04%3A26Z&sks=b&skv=2026-02-06&sig=UItcoMkvvjBu751/Rn00zpKHOH/gwLKx5RExaRsP/OI%3D' -o web-viewer/assets/hanafi-learning-deck-icon-approved.png
          test "$(stat -c %s web-viewer/assets/hanafi-learning-deck-icon-approved.png)" = '2092425'
          echo '2927924bc6f41033d660c80c7b4ea5b40c175de5bfc74e2dd8b18416e4cb1de3  web-viewer/assets/hanafi-learning-deck-icon-approved.png' | sha256sum -c -
      - name: Commit exact approved icon only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Abdullāh ibn al-Malik al-Jazzār'
          git config user.email 'dereksparks1982@gmail.com'
          git add -- web-viewer/assets/hanafi-learning-deck-icon-approved.png
          git diff --cached --quiet && exit 0
          git commit -m 'Add approved Hanafi Learning Deck icon'
          git push origin HEAD:main
