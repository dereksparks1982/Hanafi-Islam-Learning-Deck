name: Fix icon mask chunk

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-icon-mask-chunk.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct only the extra padding in mask chunk one
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          p = Path('.github/workflows/upload-approved-transparent-icon.yml')
          text = p.read_text()
          head, rest = text.split('chunks = [', 1)
          first = re.search(r"'([A-Za-z0-9+/=]+)'", rest)
          assert first, 'first mask chunk not found'
          chunk = first.group(1)
          assert len(chunk) == 1024, len(chunk)
          assert hashlib.sha256(chunk.encode()).hexdigest() == '62e44539015db2830d30346f1fc46cb1db6af4a7860c4ceda9f7611d27839f2c'

          pattern = r'(we9a6PBdHLeCtb2awuyw)(A+)(T7hcLi4C0K6czAHtyMkc)'
          m = re.search(pattern, chunk)
          assert m, 'known padding run not found'
          assert len(m.group(2)) == 73, len(m.group(2))

          corrected = chunk[:m.start(2)] + ('A' * 49) + chunk[m.end(2):]
          assert len(corrected) == 1000, len(corrected)
          assert hashlib.sha256(corrected.encode()).hexdigest() == 'ba614a470ee0395333afd7577c3699635f900c8b1bf65009b7e0ad53ef34dc3d'

          rest = rest[:first.start(1)] + corrected + rest[first.end(1):]
          updated = head + 'chunks = [' + rest
          p.write_text(updated)
          print('PASS: corrected only the 24 extra padding characters')
          PY

          git config user.name "Abdullāh ibn al-Malik al-Jazzār"
          git config user.email "dereksparks1982@gmail.com"
          git add -- .github/workflows/upload-approved-transparent-icon.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = ".github/workflows/upload-approved-transparent-icon.yml"
          git commit -m "Correct transparent icon mask chunk"
          git push origin HEAD:main
