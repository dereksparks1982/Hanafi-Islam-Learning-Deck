name: Fix icon mask chunk

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-icon-mask-chunk.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace only mask chunk one
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          p=Path('.github/workflows/upload-approved-transparent-icon.yml')
          text=p.read_text()
          good=''
          assert len(good)==1000, len(good)
          assert hashlib.sha256(good.encode()).hexdigest()=='ba614a470ee0395333afd7577c3699635f900c8b1bf65009b7e0ad53ef34dc3d'
          head,rest=text.split('chunks = [',1)
          old=re.search(r"'([A-Za-z0-9+/=]+)'",rest)
          assert old and len(old.group(1))==1024
          rest=rest[:old.start(1)]+good+rest[old.end(1):]
          p.write_text(head+'chunks = ['+rest)
          PY
          git config user.name "Abdullāh ibn al-Malik al-Jazzār"
          git config user.email "dereksparks1982@gmail.com"
          git add -- .github/workflows/upload-approved-transparent-icon.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "Correct transparent icon mask chunk"
          git push origin HEAD:main
