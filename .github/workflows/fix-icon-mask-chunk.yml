name: Fix icon mask chunk

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-icon-mask-chunk.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Find the exact 24-character correction by SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          p = Path('.github/workflows/upload-approved-transparent-icon.yml')
          text = p.read_text()
          head, rest = text.split('chunks = [', 1)
          first = re.search(r"'([A-Za-z0-9+/=]+)'", rest)
          assert first, 'first mask chunk not found'
          chunk = first.group(1)
          assert len(chunk) == 1024, len(chunk)
          assert hashlib.sha256(chunk.encode()).hexdigest() == '62e44539015db2830d30346f1fc46cb1db6af4a7860c4ceda9f7611d27839f2c'

          wanted = 'ba614a470ee0395333afd7577c3699635f900c8b1bf65009b7e0ad53ef34dc3d'
          matches = []
          for start in range(len(chunk) - 24 + 1):
              candidate = chunk[:start] + chunk[start + 24:]
              if hashlib.sha256(candidate.encode()).hexdigest() == wanted:
                  matches.append((start, candidate, chunk[start:start+24]))

          assert len(matches) == 1, f'expected exactly one hash match, got {len(matches)}'
          start, corrected, removed = matches[0]
          assert len(corrected) == 1000
          print(f'PASS: unique correction found at offset {start}; removed={removed!r}')

          rest = rest[:first.start(1)] + corrected + rest[first.end(1):]
          p.write_text(head + 'chunks = [' + rest)
          PY

          git config user.name "Abdullāh ibn al-Malik al-Jazzār"
          git config user.email "dereksparks1982@gmail.com"
          git add -- .github/workflows/upload-approved-transparent-icon.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = ".github/workflows/upload-approved-transparent-icon.yml"
          git commit -m "Correct transparent icon mask chunk"
          git push origin HEAD:main
