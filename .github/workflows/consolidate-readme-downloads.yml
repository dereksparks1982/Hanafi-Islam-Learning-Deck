name: Consolidate README downloads

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/consolidate-readme-downloads.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update README
        run: python3 .github/scripts/consolidate_readme_downloads.py
      - name: Commit README cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: consolidate README downloads" || true
          git push
      - name: Remove temporary files
        run: |
          git pull --rebase
          git rm -f .github/workflows/consolidate-readme-downloads.yml .github/scripts/consolidate_readme_downloads.py
          git commit -m "chore: remove temporary README consolidation files" || true
          git push
