name: Install approved optional card back

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-card-back.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-card-back:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download exact approved card back
        run: |
          mkdir -p card-back
          curl -fL 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-7f24-822f-9b0c-9da0dad8d148/raw?se=2026-09-19T07%3A35%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=62b2e012-233e-5737-8385-73773708396b&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T18%3A53%3A01Z&ske=2026-09-19T18%3A53%3A01Z&sks=b&skv=2026-02-06&sig=p%2BVXSOGtM16qTJ2hJEMhJn8DL0EHTYeYeQdiDfJf3ZE%3D' -o card-back/CardBack.png
          echo 'ba8a89d2e293d91f82c9f955c119daccc1beba15d03c47e95578a0867a6a4ab1  card-back/CardBack.png' | sha256sum -c -

      - name: Make the optional card back the sixth preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('card-back/card-back.jpg', 'card-back/CardBack.png')
          p.write_text(s)
          PY
          rm -rf .cardback-upload .cardback-upload-b85

      - name: Commit card back and preview link
        run: |
          git config user.name 'Hanafi Learning Deck Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Add approved optional card back and preview' || exit 0
          git push
