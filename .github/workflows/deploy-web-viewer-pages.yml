name: Main Web App Build

on:
  push:
    branches: [main]
    paths:
      - "web-viewer/**"
      - "cards/**"
      - "Sacred-Places-Expansion/**"
      - "99-Names-of-Allah-Expansion/**"
      - "Arabic-Alphabet-Expansion/cards/**"
      - "Important-Places-Expansion/**"
      - ".github/workflows/deploy-web-viewer-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hanafi-main-web-app
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete gh-pages branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/gh-pages" || true
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow || true

  main:
    needs: cleanup
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate everything from main
        shell: bash
        run: |
          set -euo pipefail
          node --check web-viewer/app.js
          node --check web-viewer/sw.js
          node --check web-viewer/quran/app.js
          node --check web-viewer/makkah/app.js
          python3 -m json.tool web-viewer/manifest.webmanifest >/dev/null
          python3 -m json.tool web-viewer/quran/data/page-001.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          main = [Path(f"cards/card_{i:03d}.png") for i in range(147)]
          sacred = list(Path("Sacred-Places-Expansion").glob("card_*.png"))
          names = list(Path("99-Names-of-Allah-Expansion").glob("card_*.png"))
          arabic = list(Path("Arabic-Alphabet-Expansion/cards").glob("card_*.png"))
          important = list(Path("Important-Places-Expansion").glob("card_*.png"))
          assert all(p.is_file() for p in main), "main deck card missing"
          counts = [len(main), len(sacred), len(names), len(arabic), len(important)]
          assert counts == [147, 19, 12, 28, 3], counts
          assert sum(counts) == 209
          print("PASS: 209 current card images")

          quran_path = Path("web-viewer/quran/data/page-001.json")
          data = json.loads(quran_path.read_text(encoding="utf-8"))
          assert data["release"] == "v1.8", data["release"]
          assert data["page"] == 1
          assert data["surah"]["number"] == 1
          assert data["surah"]["ayah_count"] == 7
          refs = [ayah["ref"] for ayah in data["ayahs"]]
          assert refs == [f"1:{i}" for i in range(1, 8)], refs
          assert all(ayah["arabic"].strip() for ayah in data["ayahs"])
          assert all(ayah["transliteration"].strip() for ayah in data["ayahs"])
          assert all(ayah["english"].strip() for ayah in data["ayahs"])
          print("PASS: Qur'an Reader Page 1 prototype data")

          for required in (
              Path("web-viewer/makkah/index.html"),
              Path("web-viewer/makkah/styles.css"),
              Path("web-viewer/makkah/app.js"),
          ):
              assert required.is_file(), f"missing Makkah clock asset: {required}"
          makkah_js = Path("web-viewer/makkah/app.js").read_text(encoding="utf-8")
          assert "Asia/Riyadh" in makkah_js
          assert "CalculationMethod.UmmAlQura" in makkah_js
          print("PASS: Makkah prayer clock prototype assets")
          PY

      - name: Build Web App from main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a web-viewer/. _site/
          cp -a cards _site/cards
          cp -a Sacred-Places-Expansion _site/Sacred-Places-Expansion
          cp -a 99-Names-of-Allah-Expansion _site/99-Names-of-Allah-Expansion
          mkdir -p _site/Arabic-Alphabet-Expansion
          cp -a Arabic-Alphabet-Expansion/cards _site/Arabic-Alphabet-Expansion/cards
          cp -a Important-Places-Expansion _site/Important-Places-Expansion
          touch _site/.nojekyll

      - name: Configure Pages from main build
        uses: actions/configure-pages@v5

      - name: Upload main build
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy main build
        id: deployment
        uses: actions/deploy-pages@v4
