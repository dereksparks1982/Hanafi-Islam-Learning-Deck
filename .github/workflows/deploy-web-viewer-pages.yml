name: Build Web Viewer publishing branch

on:
  push:
    branches: [main]
    paths:
      - "web-viewer/**"
      - "cards/**"
      - "Sacred-Places-Expansion/**"
      - "99-Names-of-Allah-Expansion/**"
      - "Arabic-Alphabet-Expansion/cards/**"
      - "Important-Places-Expansion/**"
      - ".github/workflows/deploy-web-viewer-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hanafi-web-viewer-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Web Viewer
        shell: bash
        run: |
          set -euo pipefail
          node --check web-viewer/app.js
          node --check web-viewer/sw.js
          python3 -m json.tool web-viewer/manifest.webmanifest >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          main = [Path(f"cards/card_{i:03d}.png") for i in range(147)]
          sacred = list(Path("Sacred-Places-Expansion").glob("card_*.png"))
          names = list(Path("99-Names-of-Allah-Expansion").glob("card_*.png"))
          arabic = list(Path("Arabic-Alphabet-Expansion/cards").glob("card_*.png"))
          important = list(Path("Important-Places-Expansion").glob("card_*.png"))
          assert all(p.is_file() for p in main), "main deck card missing"
          counts = [len(main), len(sacred), len(names), len(arabic), len(important)]
          assert counts == [147, 19, 12, 28, 3], counts
          assert sum(counts) == 209
          print("PASS: 209 current card images")
          PY

      - name: Stage publishing tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a web-viewer/. _site/
          cp -a cards _site/cards
          cp -a Sacred-Places-Expansion _site/Sacred-Places-Expansion
          cp -a 99-Names-of-Allah-Expansion _site/99-Names-of-Allah-Expansion
          mkdir -p _site/Arabic-Alphabet-Expansion
          cp -a Arabic-Alphabet-Expansion/cards _site/Arabic-Alphabet-Expansion/cards
          cp -a Important-Places-Expansion _site/Important-Places-Expansion
          touch _site/.nojekyll

      - name: Publish gh-pages branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd _site
          git init -b gh-pages
          git config user.name "Abdullāh ibn al-Malik al-Jazzār"
          git config user.email "dereksparks1982@gmail.com"
          git add .
          git diff --cached --check
          git commit -m "Publish Hanafi Learning Deck Web Viewer"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
