name: Apply version position

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-version-position.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add shared version-position stylesheet to interior pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('web-viewer/live/index.html'),
              Path('web-viewer/explore/index.html'),
              Path('web-viewer/makkah/index.html'),
              Path('web-viewer/media/index.html'),
              Path('web-viewer/quran/index.html'),
          ]
          link = '  <link rel="stylesheet" href="../version-position.css?rev=20260923a">\n'
          for path in files:
              text = path.read_text(encoding='utf-8')
              if 'version-position.css?rev=20260923a' in text:
                  continue
              if '</head>' not in text:
                  raise SystemExit(f'Missing </head> in {path}')
              text = text.replace('</head>', link + '</head>', 1)
              path.write_text(text, encoding='utf-8')

          for path in files:
              text = path.read_text(encoding='utf-8')
              if text.count('version-position.css?rev=20260923a') != 1:
                  raise SystemExit(f'Version stylesheet validation failed for {path}')
          PY

      - name: Commit only version-position wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-viewer/live/index.html web-viewer/explore/index.html web-viewer/makkah/index.html web-viewer/media/index.html web-viewer/quran/index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Align interior version labels with home page"
          git push origin HEAD:main
