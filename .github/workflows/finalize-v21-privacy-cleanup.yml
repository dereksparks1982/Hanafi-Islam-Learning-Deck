name: Finalize v2.1 privacy cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v21-privacy-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove private feature and all current-branch references
        shell: python
        run: |
          from pathlib import Path
          import re
          import shutil

          root = Path('.')

          # Remove the implementation, content, access code, and dedicated artwork.
          shutil.rmtree(root / 'web-viewer/advanced-library', ignore_errors=True)
          for rel in [
              'web-viewer/secret-library-trigger.js',
              'web-viewer/assets/hanafi-advanced-library-background-approved.png',
              'web-viewer/assets/hanafi-secret-library-lock-approved.png',
          ]:
              p = root / rel
              if p.exists():
                  p.unlink()

          def read(rel):
              p = root / rel
              return p.read_text(encoding='utf-8') if p.exists() else None

          def write(rel, text):
              p = root / rel
              if p.exists():
                  p.write_text(text, encoding='utf-8')

          # Remove live references from the Web App shell.
          rel = 'web-viewer/index.html'
          text = read(rel)
          if text is not None:
              text = text.replace('  <script src="secret-library-trigger.js?rev=20260924b" defer></script>\n', '')
              write(rel, text)

          rel = 'web-viewer/sw.js'
          text = read(rel)
          if text is not None:
              text = text.replace('  `./secret-library-trigger.js?rev=20260924b`,\n', '')
              write(rel, text)

          # Remove whole documentation sections whose only purpose was this feature.
          section_rules = {
              'README.md': [
                  r'(?ms)^## Advanced Learner Library\s*\n.*?(?=^## |\Z)',
              ],
              'docs/CURRENT_HANDOFF.md': [
                  r'(?ms)^## Advanced Learner Library / Secret Library\s*\n.*?(?=^## |\Z)',
              ],
              'docs/COMPANY_BIBLE.md': [
                  r'(?ms)^### Restricted / Secret Library documentation\s*\n.*?(?=^## |\Z)',
              ],
              'docs/V2.1_CLOSEOUT.md': [
                  r'(?ms)^### Advanced Learner Library\s*\n.*?(?=^### |^## |\Z)',
              ],
              'docs/roadmap.md': [
                  r'(?ms)^## Open Library and Restricted Library\s*\n.*?(?=^## |\Z)',
              ],
          }
          for rel, rules in section_rules.items():
              text = read(rel)
              if text is None:
                  continue
              for pattern in rules:
                  text = re.sub(pattern, '', text)
              write(rel, text)

          # Fix headings that included the feature name alongside unrelated v2.1 work.
          replacements = {
              'README.md': {
                  '## v2.1 Web App identity, Advanced Learner Library & self-hosted Media - closed':
                      '## v2.1 Web App identity & self-hosted Media - closed',
              },
              'docs/changelog.md': {
                  'Advanced Learner Library': '',
              },
          }
          for rel, pairs in replacements.items():
              text = read(rel)
              if text is None:
                  continue
              for old, new in pairs.items():
                  text = text.replace(old, new)
              write(rel, text)

          # Remove any remaining lines that disclose or name this private feature.
          targeted = [
              'README.md',
              'docs/README.md',
              'docs/CURRENT_HANDOFF.md',
              'docs/COMPANY_BIBLE.md',
              'docs/V2.1_CLOSEOUT.md',
              'docs/changelog.md',
              'docs/roadmap.md',
              'docs/build-notes.md',
              'docs/LEGAL_AND_SOURCE_POLICY.md',
              'QA_REPORT.txt',
              'web-viewer/README.md',
              'web-viewer/about/index.html',
              'web-viewer/index.html',
              'web-viewer/sw.js',
              'web-viewer/app.js',
              'web-viewer/styles.css',
              'web-viewer/home-branding.css',
          ]
          forbidden_line_terms = [
              'advanced learner library',
              'advanced-library',
              'secret library',
              'secret-library',
              'restricted library',
              'the green book',
              'the-green-book',
              'hidden access',
              'hidden gesture',
              'research gate',
              'research key',
              'unlocking secret',
              'restricted-study',
              'locked gate',
              'locked-gate',
              'unlocked library',
              'unlocked-library',
              'hanafi-advanced-library-background-approved',
              'hanafi-secret-library-lock-approved',
          ]
          for rel in targeted:
              text = read(rel)
              if text is None:
                  continue
              kept = []
              for line in text.splitlines(keepends=True):
                  low = line.lower()
                  if any(term in low for term in forbidden_line_terms):
                      continue
                  kept.append(line)
              write(rel, ''.join(kept))

          # Remove this one-time workflow before committing, so it does not remain in main.
          me = root / '.github/workflows/finalize-v21-privacy-cleanup.yml'
          if me.exists():
              me.unlink()

          # Final current-tree text scan. Fail rather than leave an overlooked reference.
          forbidden_scan_terms = forbidden_line_terms
          hits = []
          text_suffixes = {'.md', '.txt', '.html', '.js', '.css', '.json', '.yml', '.yaml', '.py', '.sh', '.cpp', '.h', '.cmake'}
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              if p.suffix.lower() not in text_suffixes and p.name not in {'CMakeLists.txt'}:
                  continue
              try:
                  data = p.read_text(encoding='utf-8').lower()
              except UnicodeDecodeError:
                  continue
              for term in forbidden_scan_terms:
                  if term in data:
                      hits.append(f'{p}: {term}')
          if hits:
              raise SystemExit('Private feature references remain:\n' + '\n'.join(hits))

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes were needed."
            exit 0
          fi
          git commit -m "Remove private feature from current project"
          git push origin HEAD:main
