name: Clean README old-version language

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/clean-readme-old-version-language.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete-version commentary from README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              "Only the current working edition is offered for download. Obsolete release packages are removed when superseded.\n\n",
              ""
          )

          s = s.replace(
              "The **99 Names of Allah Expansion has not yet been converted to the v1.4 independent numbering system**. Until that work is completed, its v1.3 release below remains a historical download rather than a current v1.4 package.\n\n",
              "The **99 Names of Allah Expansion** is being rebuilt for v1.4 and will be added to the current downloads when complete.\n\n"
          )

          s = s.replace(
              "Older numbering may appear in project history, but obsolete release packages are not offered for download.\n\n",
              ""
          )

          old = """## 99 Names of Allah Expansion\n\nThe previous old-numbered edition has been removed from the current downloadable repository. A new **v1.4 edition numbered independently from Card 1** is being prepared.\n\nUntil that rebuild is complete, there is **no 99 Names download**. This prevents obsolete card numbering from continuing to circulate.\n\n"""
          new = """## 99 Names of Allah Expansion\n\nA **v1.4 edition numbered independently from Card 1** is being prepared.\n\nThe download will be added when the v1.4 rebuild is complete.\n\n"""
          s = s.replace(old, new)

          s = s.replace(
              "- 99 Names of Allah Expansion - v1.4 rebuild pending; obsolete edition removed",
              "- 99 Names of Allah Expansion - v1.4 rebuild pending"
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit README cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: remove obsolete-version commentary from README" || true
          git push

      - name: Self-remove workflow
        run: |
          git pull --rebase
          rm -f .github/workflows/clean-readme-old-version-language.yml
          git add -A
          git commit -m "chore: remove temporary README cleanup workflow" || true
          git push
