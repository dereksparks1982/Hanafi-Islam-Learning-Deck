name: Restore v2.1 private runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-v21-private-runtime.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore accepted private runtime exactly
        run: |
          set -euo pipefail
          git checkout 3477bacac413a76ad4faf886f6280b65c1126051 -- \
            web-viewer/advanced-library \
            web-viewer/secret-library-trigger.js \
            web-viewer/assets/hanafi-advanced-library-background-approved.png \
            web-viewer/assets/hanafi-secret-library-lock-approved.png \
            web-viewer/index.html \
            web-viewer/sw.js
          rm -f .github/workflows/restore-v21-private-runtime.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore accepted private v2.1 runtime"
          git push origin HEAD:main
