name: Wire approved icon site-wide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-approved-icon-sitewide.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hanafi-approved-icon-wiring
  cancel-in-progress: false

jobs:
  wire-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point every web surface at the approved icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('web-viewer')
          approved = 'hanafi-learning-deck-icon-approved.png'

          for path in root.rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              rel = 'assets/' if path.parent == root else '../assets/'
              icon_line = f'  <link rel="icon" href="{rel}{approved}?rev=20260923a" type="image/png" sizes="1254x1254">'
              apple_line = f'  <link rel="apple-touch-icon" href="{rel}{approved}?rev=20260923a">'

              text = re.sub(r'^\s*<link rel="icon"[^>]*>\s*$', icon_line, text, flags=re.M)
              text = re.sub(r'^\s*<link rel="apple-touch-icon"[^>]*>\s*$', apple_line, text, flags=re.M)
              path.write_text(text, encoding='utf-8')

          manifest_path = root / 'manifest.webmanifest'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['icons'] = [
              {
                  'src': f'assets/{approved}',
                  'sizes': '1254x1254',
                  'type': 'image/png',
                  'purpose': 'any'
              }
          ]
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          sw_path = root / 'sw.js'
          sw = sw_path.read_text(encoding='utf-8')
          lines = sw.splitlines()
          filtered = [line for line in lines if not any(name in line for name in ('icon.svg?release=', 'icon-192.png?release=', 'icon-512.png?release='))]
          sw = '\n'.join(filtered) + '\n'
          needle = '  `./manifest.webmanifest?release=${RELEASE}`,'
          replacement = needle + '\n  `./assets/hanafi-learning-deck-icon-approved.png?rev=20260923a`,'
          if replacement not in sw:
              if needle not in sw:
                  raise SystemExit('Could not locate service-worker manifest cache entry')
              sw = sw.replace(needle, replacement, 1)
          sw_path.write_text(sw, encoding='utf-8')
          PY

          test "$(stat -c %s web-viewer/assets/hanafi-learning-deck-icon-approved.png)" = '2092425'
          echo '2927924bc6f41033d660c80c7b4ea5b40c175de5bfc74e2dd8b18416e4cb1de3  web-viewer/assets/hanafi-learning-deck-icon-approved.png' | sha256sum -c -
          python3 -m json.tool web-viewer/manifest.webmanifest >/dev/null
          node --check web-viewer/sw.js
          git diff --check

      - name: Commit icon wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Abdullāh ibn al-Malik al-Jazzār'
          git config user.email 'dereksparks1982@gmail.com'
          git add web-viewer
          git diff --cached --quiet && exit 0
          git commit -m 'Use approved icon across web app'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-viewer

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
