name: Publish approved Important Places Card 3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-approved-card3.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install browser and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-noto-core
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Download approved real mosque photograph
        run: |
          curl -L --fail --retry 3 \
            'https://upload.wikimedia.org/wikipedia/commons/7/7a/%D8%AC%D8%A7%D9%85%D8%B9_%D8%A7%D8%A8%D9%8A_%D8%AD%D9%86%D9%8A%D9%81%D8%A9_%D8%A7%D9%84%D9%86%D8%B9%D9%85%D8%A7%D9%86_%D9%81%D9%8A_%D8%A8%D8%BA%D8%AF%D8%A7%D8%AF.jpg' \
            -o /tmp/abu_hanifa.jpg
          test -s /tmp/abu_hanifa.jpg

      - name: Freeze accepted preview to PNG
        run: |
          cat > /tmp/card3.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><style>
          *{box-sizing:border-box}html,body{margin:0;background:#1d1d1d;font-family:Georgia,"Times New Roman",serif;color:#171714}.stage{padding:24px;display:flex;justify-content:center;align-items:flex-start}.card{position:relative;width:1024px;height:1536px;flex:0 0 1024px;background:#fffdf7;border-radius:28px;overflow:hidden}.outer{position:absolute;inset:43px;border:6px solid #ef0111;border-radius:30px;pointer-events:none}.inner{position:absolute;inset:54px;border:2.5px solid #b78412;border-radius:22px;pointer-events:none}.content{position:absolute;left:82px;right:82px;top:76px;bottom:90px;width:auto;overflow:hidden}.header{height:124px;display:grid;grid-template-columns:540px 296px;column-gap:24px;border-bottom:2.5px solid #b78412;overflow:hidden}.h-left,.h-right{min-width:0;overflow:hidden}.english{margin:0 0 12px;font-size:36px;line-height:1.05;font-weight:700;white-space:nowrap}.location{font-size:28px;line-height:1.05;font-weight:700;color:#063b27;white-space:nowrap}.h-right{text-align:right}.arabic{margin:0 0 11px;width:100%;font-family:"Noto Naskh Arabic","Amiri","Scheherazade New",serif;font-size:30px;line-height:1.15;font-weight:700;color:#063b27;direction:rtl;unicode-bidi:isolate;text-align:right;white-space:nowrap}.latin{width:100%;font-size:23px;line-height:1.05;font-weight:700;font-style:italic;color:#063b27;text-align:right;white-space:nowrap}.photo{position:relative;width:100%;max-width:100%;height:450px;margin:12px 0 0;overflow:hidden;border-radius:14px;background:#e8e1d3}.photo img{display:block;width:100%;max-width:100%;height:100%;object-fit:cover;object-position:center center}.photo-credit{position:absolute;right:9px;bottom:7px;padding:3px 6px;border-radius:5px;background:rgba(255,253,247,.88);font:12px/1.1 system-ui,sans-serif;color:#40392f}.section{padding:10px 6px 9px;border-bottom:2px solid #b78412}.section h2{margin:0 0 4px;font-size:28px;line-height:1;font-weight:700;color:#063b27}.section.deck h2{color:#171714}.section p{margin:0;font-size:20px;line-height:1.18}.sources{padding:10px 6px 0;font-size:14px;line-height:1.15;color:#171714}.sources .credit{margin-top:4px;text-align:center;font-size:12px;color:#6a6256}
          </style></head><body><div class="stage"><div class="card"><div class="outer"></div><div class="inner"></div><div class="content">
          <div class="header"><div class="h-left"><div class="english">3. ABU HANIFA MOSQUE</div><div class="location">Baghdad, Iraq</div></div><div class="h-right"><div class="arabic" lang="ar">مسجد أبي حنيفة</div><div class="latin">Masjid Abī Ḥanīfah</div></div></div>
          <div class="photo"><img src="PHOTO_DATA" alt="Abu Hanifa Mosque in Baghdad"><div class="photo-credit">Real photograph • Baghdad • 2024</div></div>
          <div class="section"><h2>WHAT IS IT?</h2><p>Abu Hanifa Mosque, also known as Jāmiʿ al-Imām al-Aʿẓam, is a major Sunni mosque and scholarly complex in Baghdad’s al-Aʿẓamiyya district. It surrounds the burial place of Imam Abu Hanifa.</p></div>
          <div class="section"><h2>HISTORY</h2><p>Imam Abu Hanifa died in Baghdad in 150 AH / 767 CE. A mosque and teaching complex developed around his tomb by the 11th century and was repeatedly rebuilt and expanded under later rulers, including the Ottomans.</p></div>
          <div class="section"><h2>WHY IT MATTERS</h2><p>For Hanafi Muslims, the site is directly connected to the jurist whose teaching gave the madhhab its name. Al-Aʿẓamiyya itself is named for his honorific al-Imām al-Aʿẓam, “the Great Imam.”</p></div>
          <div class="section deck"><h2>THIS DECK</h2><p>Included for historical, scholarly, and Hanafi importance, not as a claim that the building itself has special sacred status.</p></div>
          <div class="sources"><b>Sources:</b> Hāshim al-Aʿẓamī • Osman Ezici (2025) • Wikimedia Commons<div class="credit">Photo: Ali.tinbo • CC BY-SA 4.0 • Wikimedia Commons</div></div>
          </div></div></div></body></html>
          HTML
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('/tmp/card3.html')
          s=p.read_text(encoding='utf-8')
          photo=base64.b64encode(Path('/tmp/abu_hanifa.jpg').read_bytes()).decode('ascii')
          p.write_text(s.replace('PHOTO_DATA','data:image/jpeg;base64,'+photo),encoding='utf-8')
          PY
          cat > /tmp/render.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1200,height:1700},deviceScaleFactor:1});
            await page.goto('file:///tmp/card3.html');
            await page.locator('.card').screenshot({path:'Important-Places-Expansion/card_003_abu_hanifa_mosque.png'});
            await browser.close();
          })();
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/render.js

      - name: Verify final card
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          p=Path('Important-Places-Expansion/card_003_abu_hanifa_mosque.png')
          im=Image.open(p)
          assert im.size==(1024,1536), im.size
          print('bytes',p.stat().st_size)
          print('sha256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Commit approved Card 3 only
        run: |
          git config user.name 'Abdullāh ibn al-Malik al-Jazzār'
          git config user.email 'dereksparks1982@gmail.com'
          git add Important-Places-Expansion/card_003_abu_hanifa_mosque.png
          git commit -m 'Add approved Abu Hanifa Mosque card'
          git push origin HEAD:main
