name: One-time Important Places preview

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-important-places-preview.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Add visual preview to Important Places roadmap section
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')

          marker = "This is intentionally different from the Sacred Places Expansion.\n"
          preview = r'''

#### Visual preview

These are **representative candidate locations**, not a final approved card list. The finished expansion will use researched photographs and source notes, while keeping the distinction between **historical/cultural importance** and **religious sanctity** clear.

<p align="center"><strong>Lal Masjid — Islamabad, Pakistan</strong><br>
<a href="https://commons.wikimedia.org/wiki/File:Red_Mosque_Islamabad_1.jpg"><img src="https://upload.wikimedia.org/wikipedia/commons/4/48/Red_Mosque_Islamabad_1.jpg" width="560" alt="Lal Masjid in Islamabad, Pakistan"></a><br>
<sub>Photo: KhhHan432, CC BY-SA 4.0, via Wikimedia Commons.</sub></p>

<p align="center"><strong>Chinguetti Mosque — Chinguetti, Mauritania</strong><br>
<a href="https://commons.wikimedia.org/wiki/File:Chinguetti_Mosque_2007.jpg"><img src="https://upload.wikimedia.org/wikipedia/commons/f/f9/Chinguetti_Mosque_2007.jpg" width="560" alt="Chinguetti Mosque in Mauritania"></a><br>
<sub>Photo: Radosław Botev / Fundacja Nomos, CC BY 3.0 PL, via Wikimedia Commons.</sub></p>

<p align="center"><strong>Friday Mosque of Herat — Herat, Afghanistan</strong><br>
<a href="https://commons.wikimedia.org/wiki/File:HeratFridayMosque.jpg"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d6/HeratFridayMosque.jpg" width="560" alt="Friday Mosque of Herat, Afghanistan"></a><br>
<sub>Photo: Artacoana, public domain, via Wikimedia Commons.</sub></p>

<p align="center"><strong>Sankore Mosque — Timbuktu, Mali</strong><br>
<a href="https://commons.wikimedia.org/wiki/File:Sankore_Mosque_in_Timbuktu.jpg"><img src="https://upload.wikimedia.org/wikipedia/commons/f/f1/Sankore_Mosque_in_Timbuktu.jpg" width="560" alt="Sankore Mosque in Timbuktu, Mali"></a><br>
<sub>Photo: upyernoz, CC BY 2.0, via Wikimedia Commons.</sub></p>

<p align="center"><strong>Al-Qarawiyyin Mosque — Fez, Morocco</strong><br>
<a href="https://commons.wikimedia.org/wiki/File:The_minaret_of_Al-Qarawiyyin_Mosque_in_Fez.jpg"><img src="https://upload.wikimedia.org/wikipedia/commons/8/86/The_minaret_of_Al-Qarawiyyin_Mosque_in_Fez.jpg" width="560" alt="Minaret of Al-Qarawiyyin Mosque in Fez, Morocco"></a><br>
<sub>Photo: RACHID BAYA, CC BY-SA 4.0, via Wikimedia Commons.</sub></p>
'''

          if '#### Visual preview' not in text:
              if marker not in text:
                  raise SystemExit('Important Places insertion marker not found')
              text = text.replace(marker, marker + preview, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add visual preview for Important Places expansion"
            git push
          fi
