name: One-time main deck Arabic headers

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-main-arabic-headers.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arabic rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil python3-numpy fonts-noto-core

      - name: Add approved Arabic title treatment
        run: |
          python3 tools/apply_main_deck_arabic_headers.py

      - name: Update QA note
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('QA_REPORT.txt')
          text = p.read_text(encoding='utf-8')
          note = (
              '\nV1.6 MAIN-DECK ARABIC HEADER UPDATE\n'
              'PASS: Arabic header labels added to 145 of 146 cards; Card 2 remains intentionally English-only.\n'
              'PASS: existing pixels below each card header were preserved exactly during the header operation.\n'
              'PASS: 37 printable sheets and contact sheet rebuilt from the updated card PNGs.\n'
              'NOTE: Arabic header translations remain subject to qualified Islamic/Arabic review.\n'
          )
          if 'V1.6 MAIN-DECK ARABIC HEADER UPDATE' not in text:
              p.write_text(text.rstrip() + '\n' + note, encoding='utf-8')
          PY

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards sheets contact_sheet.png QA_REPORT.txt
          if git diff --cached --quiet; then
            echo "No generated changes found"
          else
            git commit -m "Add Arabic headers to main deck"
            git push
          fi
