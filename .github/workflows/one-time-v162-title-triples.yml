name: One-time v1.6.2 three-language titles and Chinguetti

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-v162-title-triples.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rendering dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pil python3-numpy fonts-noto-core fonts-dejavu-core

      - name: Apply English, Latin transliteration, and Arabic title bars
        run: |
          set -euo pipefail
          python3 tools/apply_title_triples.py

      - name: Download exact approved Chinguetti Card 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Important-Places-Expansion
          URL='https://sdmntprukwest.oaiusercontent.com/files/00000000-c828-8243-a85e-6c806914b553/raw?se=2026-09-20T19%3A22%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=9cbc6f3a-fc5f-5292-a219-390ecf3b19d1&skoid=7b771594-2b4f-4e93-93be-fdeeeb59aaf9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T15%3A24%3A02Z&ske=2026-09-21T15%3A24%3A02Z&sks=b&skv=2026-02-06&sig=LP3r5qvw88MfliOhRkp6wGby9%2BQRA2SJ89x2t54KSN0%3D'
          curl --fail --location --retry 3 "$URL" -o Important-Places-Expansion/card_002_chinguetti_mosque.png

      - name: Verify exact Chinguetti bytes
        shell: bash
        run: |
          set -euo pipefail
          FILE='Important-Places-Expansion/card_002_chinguetti_mosque.png'
          test "$(stat -c%s "$FILE")" = '1834510'
          echo '07a7a744a84706993c60af2748c8913c7bd44d265c2c0b48d67940d959997ab2  Important-Places-Expansion/card_002_chinguetti_mosque.png' | sha256sum -c -

      - name: Update v1.6.2 QA note
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('QA_REPORT.txt')
          text = p.read_text(encoding='utf-8')
          note = (
              '\nV1.6.2 THREE-LANGUAGE TITLE UPDATE\n'
              'PASS: relevant title bars now present English, Latin transliteration, and Arabic across the main deck and current expansions.\n'
              'PASS: title-bar operation preserves existing pixels below the detected header divider.\n'
              'PASS: printable sheets and contact sheets were rebuilt from the updated cards.\n'
              'PASS: Important Places Card 2, Chinguetti Mosque, was added from the exact approved/tested PNG bytes.\n'
              'NOTE: Arabic and transliteration labels remain subject to qualified Islamic/Arabic review.\n'
          )
          if 'V1.6.2 THREE-LANGUAGE TITLE UPDATE' not in text:
              p.write_text(text.rstrip() + '\n' + note, encoding='utf-8')
          PY

      - name: Commit v1.6.2 card update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards sheets contact_sheet.png \
            Sacred-Places-Expansion \
            99-Names-of-Allah-Expansion \
            Arabic-Alphabet-Expansion \
            Important-Places-Expansion/card_001_lal_masjid.png \
            Important-Places-Expansion/card_002_chinguetti_mosque.png \
            QA_REPORT.txt
          if git diff --cached --quiet; then
            echo 'No generated changes found'
          else
            git commit -m 'v1.6.2: add three-language titles and Chinguetti'
            git push
          fi