name: Diagnose icon mask chunks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-icon-mask.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect embedded mask chunks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          text = Path('.github/workflows/upload-approved-transparent-icon.yml').read_text()
          block = text.split('chunks = [',1)[1].split(']',1)[0]
          chunks = re.findall(r"'([A-Za-z0-9+/=]+)'", block)
          print('count', len(chunks))
          for i,c in enumerate(chunks,1):
              print(i, len(c), hashlib.sha256(c.encode()).hexdigest())
          joined=''.join(chunks)
          print('total', len(joined), hashlib.sha256(joined.encode()).hexdigest())
          PY
