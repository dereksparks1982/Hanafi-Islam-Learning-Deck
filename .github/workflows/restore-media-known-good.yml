name: Restore Media known good

on:
  push:
    paths:
      - '.github/workflows/restore-media-known-good.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore last known working Media page
        run: |
          set -euo pipefail
          git checkout b514e2114e8b4a2c289cd5c123af73451cb0c9e1 -- web-viewer/media/index.html
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-viewer/media/index.html
          git commit -m "Restore known-good Media page"
          git push origin main
