name: Render card back

on:
  push:
    paths:
      - 'card-back/CardBack.svg'
      - '.github/workflows/render-cardback.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check cairosvg

      - name: Render PNG
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url='card-back/CardBack.svg',
              write_to='card-back/CardBack.png',
              output_width=1060,
              output_height=1484,
          )
          PY

      - name: Commit rendered card back
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add card-back/CardBack.png
          if git diff --cached --quiet; then
            echo 'CardBack.png is already current.'
          else
            git commit -m 'Render updated card back'
            git push
          fi
