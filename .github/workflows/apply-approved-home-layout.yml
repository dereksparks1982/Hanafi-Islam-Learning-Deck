name: Apply approved home background layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-approved-home-layout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire approved fixed background and desktop scale
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64; exec(base64.b64decode(''))"
      - name: Commit only home-page wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Abdullāh ibn al-Malik al-Jazzār'
          git config user.email 'dereksparks1982@gmail.com'
          git add -- web-viewer/styles.css web-viewer/index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Use approved fixed home background at 100 percent zoom'
          git push origin HEAD:main
