name: Update correction policy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-correction-policy.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh main
        run: git pull --ff-only origin main

      - name: Update README correction policy
        env:
          OLD_REVIEW: 
          NEW_REVIEW: 
          OLD_CONTRIB: 
          NEW_CONTRIB: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          old_review = base64.b64decode(os.environ['OLD_REVIEW']).decode('utf-8')
          new_review = base64.b64decode(os.environ['NEW_REVIEW']).decode('utf-8')
          old_contrib = base64.b64decode(os.environ['OLD_CONTRIB']).decode('utf-8')
          new_contrib = base64.b64decode(os.environ['NEW_CONTRIB']).decode('utf-8')
          if text.count(old_review) != 1:
              raise SystemExit('Corrections and Imam Review block did not match exactly once')
          if text.count(old_contrib) != 1:
              raise SystemExit('Contributing Corrections block did not match exactly once')
          text = text.replace(old_review, new_review).replace(old_contrib, new_contrib)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit README update and remove temporary workflow
        run: |
          git config user.name "Abdullāh ibn al-Malik al-Jazzār"
          git config user.email "dereksparks1982@gmail.com"
          git rm .github/workflows/update-correction-policy.yml
          git add README.md
          git commit -m "docs: clarify Hanafi correction policy"
          git push origin HEAD:main
