name: Upload approved transparent Hanafi icon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upload-approved-transparent-icon.yml"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply and verify exact transparency mask
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, zlib

          path = Path('web-viewer/assets/hanafi-learning-deck-icon-approved.png')
          source = path.read_bytes()
          assert len(source) == 2092425, len(source)
          assert hashlib.sha256(source).hexdigest() == '2927924bc6f41033d660c80c7b4ea5b40c175de5bfc74e2dd8b18416e4cb1de3'

          mask_b64 = ''''''

          img = Image.open(path).convert('RGBA')
          assert img.size == (1254, 1254), img.size
          alpha = zlib.decompress(base64.b64decode(mask_b64))
          assert len(alpha) == 1254 * 1254, len(alpha)
          img.putalpha(Image.frombytes('L', img.size, alpha))

          rgba_sha = hashlib.sha256(img.tobytes()).hexdigest()
          assert rgba_sha == 'cf57e42d7c48011b1091b1ce11c5e0f271ba194610c023e8c1ac2153a5e90478', rgba_sha

          tmp = path.with_suffix('.transparent.png')
          img.save(tmp, 'PNG', optimize=True, compress_level=9)
          check = Image.open(tmp).convert('RGBA')
          assert check.size == (1254, 1254)
          assert hashlib.sha256(check.tobytes()).hexdigest() == 'cf57e42d7c48011b1091b1ce11c5e0f271ba194610c023e8c1ac2153a5e90478'
          tmp.replace(path)
          print('PASS: approved RGB preserved; exact transparency mask applied')
          print('PNG bytes:', path.stat().st_size)
          print('PNG SHA-256:', hashlib.sha256(path.read_bytes()).hexdigest())
          PY

      - name: Commit only approved icon
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdullāh ibn al-Malik al-Jazzār"
          git config user.email "dereksparks1982@gmail.com"
          git add -- web-viewer/assets/hanafi-learning-deck-icon-approved.png
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "web-viewer/assets/hanafi-learning-deck-icon-approved.png"
          git commit -m "Remove background from approved icon"
          git push origin HEAD:main
