name: Upload approved transparent Hanafi icon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upload-approved-transparent-icon.yml"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download and verify approved transparent icon
        shell: bash
        run: |
          set -euo pipefail
          dest="web-viewer/assets/hanafi-learning-deck-icon-approved.png"
          tmp="${dest}.download"
          mkdir -p "$(dirname "$dest")"
          curl -L --fail --retry 3 --retry-delay 1 "https://drive.google.com/uc?export=download&id=1RNadgbTbKy4kXvyJ4JpieXnwVrJViu77" -o "$tmp"
          actual_size="$(wc -c < "$tmp" | tr -d ' ')"
          actual_sha="$(sha256sum "$tmp" | awk '{print $1}')"
          test "$actual_size" = "2218182"
          test "$actual_sha" = "980b7ce4e145331918cc896f92d50ba6f4287e3ead1dbd24f519f68c61279a58"
          mv "$tmp" "$dest"
          echo "PASS: exact transparent approved icon verified"

      - name: Commit only approved icon
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdullāh ibn al-Malik al-Jazzār"
          git config user.email "dereksparks1982@gmail.com"
          git add -- web-viewer/assets/hanafi-learning-deck-icon-approved.png
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "web-viewer/assets/hanafi-learning-deck-icon-approved.png"
          git commit -m "Remove background from approved icon"
          git push origin HEAD:main
