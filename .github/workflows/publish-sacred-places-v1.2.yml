name: Publish Sacred Places Expansion v1.2

on:
  push:
    branches: [main]
    paths:
      - "PUBLISH_SACRED_PLACES_V1_2"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify expansion separation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def numbers(folder):
              out = []
              for p in Path(folder).glob('card_*.png'):
                  m = re.match(r'card_(\d+)', p.name)
                  if m:
                      out.append(int(m.group(1)))
              return sorted(out)

          base = numbers('cards')
          expansion = numbers('Sacred-Places-Expansion')

          assert base == list(range(1, 146)), f'Base cards wrong: {base[:3]} ... {base[-3:]} count={len(base)}'
          assert expansion == list(range(146, 165)), f'Expansion cards wrong: {expansion}'
          assert not Path('cards/card_146.png').exists(), 'Card 146 must not be in the base cards folder'
          print('PASS: base deck is Cards 1-145 only')
          print('PASS: Sacred Places Expansion is Cards 146-164 only')
          PY

      - name: Package expansion only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          zip -qr "$RUNNER_TEMP/release/Hanafi-Learning-Deck-v1.2-Sacred-Places-Expansion.zip" Sacred-Places-Expansion
          cd "$RUNNER_TEMP/release"
          sha256sum Hanafi-Learning-Deck-v1.2-Sacred-Places-Expansion.zip > SHA256SUMS.txt

      - name: Remove temporary publishing files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-sacred-places-v1.2.yml
          rm -f PUBLISH_SACRED_PLACES_V1_2
          git config user.name "Hanafi Learning Deck Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize separate Sacred Places Expansion v1.2 [skip ci]"
            git push origin main
          fi
          echo "CLEAN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish Sacred Places Expansion v1.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v1.2.0 --yes || true
          git push origin :refs/tags/v1.2.0 || true
          git tag -d v1.2.0 || true
          git tag -a v1.2.0 "$CLEAN_SHA" -m "Sacred Places Expansion v1.2"
          git push origin v1.2.0
          gh release create v1.2.0 \
            "$RUNNER_TEMP/release/Hanafi-Learning-Deck-v1.2-Sacred-Places-Expansion.zip" \
            "$RUNNER_TEMP/release/SHA256SUMS.txt" \
            --title "Sacred Places Expansion — Version 1.2" \
            --notes "Separate expansion for the Hanafi Learning Deck. The base cards folder remains Cards 1-145 only. This release contains only the Sacred Places Expansion, Cards 146-164, with Card 146 as the color key. Future expansion packs remain separate in their own folders and downloads."
