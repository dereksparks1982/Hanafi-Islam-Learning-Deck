name: Remove expansion numbering rule

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/remove-expansion-numbering-rule.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s2, n = re.subn(r'\n## Expansion Numbering Rule - v1\.4 Forward\n.*?(?=\n## Sacred Places Expansion - Version 1\.4 R2\n)', '\n', s, flags=re.S)
          assert n == 1, f'expected exactly one section, removed {n}'
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: remove expansion numbering rule section"
          git push
      - name: Self-remove workflow
        run: |
          git pull --rebase
          rm -f .github/workflows/remove-expansion-numbering-rule.yml
          git add -A
          git commit -m "chore: remove temporary README cleanup workflow"
          git push
