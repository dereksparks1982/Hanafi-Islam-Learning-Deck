name: Private Library navigation and movie styling repair

on:
  push:
    paths:
      - '.github/workflows/private-library-nav-style-fix-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply approved Private Library repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('web-viewer/advanced-library/index.html')
          text = path.read_text(encoding='utf-8')

          old_panel = '.private-movies{position:fixed;inset:78px 5vw 5vh;z-index:21;overflow:auto;padding:1rem;border:1px solid rgba(217,180,95,.42);border-radius:16px;background:rgba(3,14,10,.91);backdrop-filter:blur(5px)}'
          new_panel = '.private-movies{position:fixed;inset:78px 5vw 5vh;z-index:21;overflow:auto;padding:1rem;border:0;border-radius:0;background:transparent;backdrop-filter:none}'
          if old_panel not in text:
              raise SystemExit('Expected Private Movies panel style was not found; refusing to guess.')
          text = text.replace(old_panel, new_panel, 1)

          old_card = '.private-movie-card{border:1px solid rgba(217,180,95,.35);border-radius:13px;overflow:hidden;background:#0b1510;color:#f1e5bd;cursor:pointer;text-align:left;padding:0}'
          new_card = '.private-movie-card{border:1px solid rgba(216,181,96,.28);border-radius:16px;overflow:hidden;background:#101412;color:#f1e5bd;cursor:pointer;text-align:left;padding:0;transition:transform .15s,border-color .15s}'
          if old_card not in text:
              raise SystemExit('Expected Private Movie card style was not found; refusing to guess.')
          text = text.replace(old_card, new_card, 1)
          text = text.replace('.private-movie-card:hover,.private-movie-card:focus-visible{border-color:#d9b45f;outline:none;transform:translateY(-2px)}', '.private-movie-card:hover,.private-movie-card:focus-visible{border-color:#d8b560;outline:none;transform:translateY(-2px)}', 1)

          nav_style = '    .library-home{position:fixed;top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));z-index:31;display:inline-flex;align-items:center;min-height:42px;padding:.58rem .9rem;border:1px solid rgba(217,180,95,.45);border-radius:9px;background:rgba(3,19,14,.92);color:#ead18c;text-decoration:none;font:600 .82rem Georgia,serif;box-shadow:0 10px 30px rgba(0,0,0,.3)}\n    .library-home:hover,.library-home:focus-visible{border-color:#d9b45f;background:#0a2118;outline:none}\n'
          anchor = '    .library-mode-nav{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;z-index:30;transform:translateX(-50%);display:flex;gap:8px;padding:6px;border:1px solid rgba(217,180,95,.55);border-radius:12px;background:rgba(3,19,14,.92);box-shadow:0 10px 30px rgba(0,0,0,.35)}\n'
          if anchor not in text:
              raise SystemExit('Expected Private Library navigation style was not found; refusing to guess.')
          text = text.replace(anchor, nav_style + anchor, 1)

          body = '<body>\n'
          home = '<body>\n  <a class="library-home" href="../" aria-label="Return to Home">← Home</a>\n'
          if body not in text:
              raise SystemExit('Body opening tag was not found; refusing to guess.')
          text = text.replace(body, home, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify repair scope
        run: |
          grep -F 'class="library-home" href="../"' web-viewer/advanced-library/index.html
          grep -F '.private-movies{position:fixed;inset:78px 5vw 5vh;z-index:21;overflow:auto;padding:1rem;border:0;border-radius:0;background:transparent;backdrop-filter:none}' web-viewer/advanced-library/index.html
          grep -F '.private-movie-card{border:1px solid rgba(216,181,96,.28);border-radius:16px;overflow:hidden;background:#101412' web-viewer/advanced-library/index.html
          git diff --check

      - name: Commit repair and remove one-time workflow
        run: |
          git config user.name 'Derek Sparks'
          git config user.email 'dereksparks1982@users.noreply.github.com'
          git rm .github/workflows/private-library-nav-style-fix-once.yml
          git add web-viewer/advanced-library/index.html
          git commit -m 'Repair Private Library navigation and movie styling'
          git push origin HEAD:main
